<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Filling orbitals: nitrogen</text><rect x="40" y="70" width="64" height="64" class="df2 ds" stroke-width="3"/><path d="M60 118V72" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><path d="M84 72V118" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="150" y="70" width="64" height="64" class="df2 ds" stroke-width="3"/><path d="M170 118V72" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><path d="M194 72V118" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="290" y="70" width="64" height="64" class="df2 ds" stroke-width="3"/><path d="M322 118V72" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="360" y="70" width="64" height="64" class="df2 ds" stroke-width="3"/><path d="M392 118V72" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="430" y="70" width="64" height="64" class="df2 ds" stroke-width="3"/><path d="M462 118V72" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="72" y="164" font-size="22" class="dt" text-anchor="middle">1s</text><text x="182" y="164" font-size="22" class="dt" text-anchor="middle">2s</text><text x="392" y="164" font-size="22" class="dt" text-anchor="middle">2p</text><text x="300" y="206" font-size="24" font-weight="700" class="dt mono" text-anchor="middle">1s² 2s² 2p³</text><text x="14" y="262" font-size="22" class="dt">Aufbau: fill the lowest levels first</text><text x="14" y="292" font-size="22" class="dt">Pauli: two electrons per box at most,</text><text x="14" y="322" font-size="22" class="dt">with opposite spins</text><text x="14" y="352" font-size="22" class="dt">Hund: fill equal-energy boxes singly,</text><text x="14" y="382" font-size="22" class="dt">spins parallel, before pairing up</text>
</svg>
