<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Magnetic dipole and field</text><rect x="150" y="150" width="150" height="70" class="dfr dsr" rx="6" fill-opacity=".35" stroke-width="4"/><rect x="300" y="150" width="150" height="70" class="dfb dsb" rx="6" fill-opacity=".35" stroke-width="4"/><text x="225" y="196" font-size="30" font-weight="700" class="dt" text-anchor="middle">N</text><text x="375" y="196" font-size="30" font-weight="700" class="dt" text-anchor="middle">S</text><path d="M170 150C96 104.5 504 104.5 430 150" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M170 220C96 265.5 504 265.5 430 220" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M170 150C82 59 518 59 430 150" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M170 220C82 311 518 311 430 220" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M170 150C68 13.5 532 13.5 430 150" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M170 220C68 356.5 532 356.5 430 220" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="14" y="420" font-size="22" class="dt">Field lines run from N to S outside the</text><text x="14" y="450" font-size="22" class="dt">magnet. Two opposite poles a small distance</text><text x="14" y="480" font-size="22" class="dt">apart form a magnetic dipole.</text>
