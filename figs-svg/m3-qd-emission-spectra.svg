<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Bigger dot, smaller gap</text><rect x="46" y="70" width="28" height="150" class="dfb dsb" fill-opacity=".6" stroke-width="2"/><circle cx="60" cy="260" r="8" class="dfb" fill-opacity=".8"/><text x="60" y="310" font-size="22" class="dt" text-anchor="middle">473 nm</text><rect x="146" y="94" width="28" height="126" class="dfg dsg" fill-opacity=".6" stroke-width="2"/><circle cx="160" cy="260" r="12" class="dfg" fill-opacity=".8"/><text x="160" y="310" font-size="22" class="dt" text-anchor="middle">520 nm</text><rect x="246" y="118" width="28" height="102" class="dfy dsy" fill-opacity=".6" stroke-width="2"/><circle cx="260" cy="260" r="16" class="dfy" fill-opacity=".8"/><text x="260" y="310" font-size="22" class="dt" text-anchor="middle">560 nm</text><rect x="346" y="142" width="28" height="78" class="dfo dso" fill-opacity=".6" stroke-width="2"/><circle cx="360" cy="260" r="20" class="dfo" fill-opacity=".8"/><text x="360" y="310" font-size="22" class="dt" text-anchor="middle">600 nm</text><rect x="446" y="166" width="28" height="54" class="dfr dsr" fill-opacity=".6" stroke-width="2"/><circle cx="460" cy="260" r="24" class="dfr" fill-opacity=".8"/><text x="460" y="310" font-size="22" class="dt" text-anchor="middle">655 nm</text><path d="M30 225H570" class="ds" fill="none" stroke-width="3" /><path d="M60 345H540" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="300" y="380" font-size="22" class="dt" text-anchor="middle">QD radius grows →</text><text x="14" y="430" font-size="22" class="dt2">Peak emission slides from 473 nm (blue)</text><text x="14" y="460" font-size="22" class="dt2">to 655 nm (deep red) as the radius grows.</text><text x="14" y="490" font-size="22" class="dt2">Bar height = energy gap.</text>
