<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Ruthenium dye: the common design</text><circle cx="300" cy="200" r="40" class="dfp" fill-opacity=".5"/><text x="300" y="210" font-size="28" font-weight="700" class="dt" text-anchor="middle">Ru</text><path d="M190 130L262 190M190 130L262 210" class="ds" fill="none" stroke-width="3" /><rect x="80" y="100" width="110" height="60" class="dfb dsb" fill-opacity=".3" stroke-width="3" rx="10"/><text x="135" y="138" font-size="22" font-weight="700" class="dtb" text-anchor="middle">bipy</text><text x="120" y="192" font-size="22" font-weight="700" class="dto" text-anchor="middle">–COOH</text><path d="M190 270L262 190M190 270L262 210" class="ds" fill="none" stroke-width="3" /><rect x="80" y="240" width="110" height="60" class="dfb dsb" fill-opacity=".3" stroke-width="3" rx="10"/><text x="135" y="278" font-size="22" font-weight="700" class="dtb" text-anchor="middle">bipy</text><text x="120" y="332" font-size="22" font-weight="700" class="dto" text-anchor="middle">–COOH</text><path d="M390 130L338 200" class="ds" fill="none" stroke-width="3" /><rect x="420" y="105" width="110" height="50" class="dfg dsg" fill-opacity=".3" stroke-width="3" rx="10"/><text x="475" y="138" font-size="22" font-weight="700" class="dtg" text-anchor="middle">NCS</text><path d="M390 270L338 200" class="ds" fill="none" stroke-width="3" /><rect x="420" y="245" width="110" height="50" class="dfg dsg" fill-opacity=".3" stroke-width="3" rx="10"/><text x="475" y="278" font-size="22" font-weight="700" class="dtg" text-anchor="middle">NCS</text><path d="M40 345H560" class="dso" fill="none" stroke-width="6" /><text x="300" y="378" font-size="22" class="dt" text-anchor="middle">TiO₂ surface</text><path d="M85 328V345M85 328" class="dso" fill="none" stroke-width="3" /><text x="14" y="430" font-size="22" class="dt2">Bipyridine (bipy) rings carry –COOH</text><text x="14" y="460" font-size="22" class="dt2">groups: the anchors that bind the dye</text><text x="14" y="490" font-size="22" class="dt2">to TiO₂. Other dyes in the family swap</text><text x="14" y="520" font-size="22" class="dt2">in thiophene chains or CF₃ groups.</text>
