<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Quantum dots at work</text><text x="14" y="80" font-size="26" font-weight="700" class="dt">1  Cell tagging</text><circle cx="110" cy="150" r="26" class="dfg" fill-opacity=".6"/><circle cx="110" cy="150" r="8" class="dfg" /><circle cx="200" cy="150" r="26" class="dfg" fill-opacity=".6"/><circle cx="200" cy="150" r="8" class="dfg" /><circle cx="290" cy="150" r="26" class="dfg" fill-opacity=".6"/><circle cx="290" cy="150" r="8" class="dfg" /><text x="14" y="220" font-size="22" class="dt2">tagged cancer cells glow green</text><path d="M0 245H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="285" font-size="26" font-weight="700" class="dt">2  Metal-ion sensing grid</text><text x="14" y="320" font-size="22" class="dt2">spot colour changes with the metal ion</text><text x="14" y="350" font-size="22" class="dt2">added: Ni²⁺, Cd²⁺, Zn²⁺, Hg²⁺, Cu²⁺, Pb²⁺,</text><text x="14" y="380" font-size="22" class="dt2">Ag⁺, Mn²⁺, Co²⁺, Cr(VI)</text><circle cx="60" cy="430" r="20" class="dfr" fill-opacity=".8"/><circle cx="120" cy="430" r="20" class="dfg" fill-opacity=".8"/><circle cx="180" cy="430" r="20" class="dfy" fill-opacity=".8"/><circle cx="240" cy="430" r="20" class="dfb" fill-opacity=".8"/><circle cx="300" cy="430" r="20" class="dfo" fill-opacity=".8"/><path d="M0 475H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="515" font-size="26" font-weight="700" class="dt">3  QD LEDs</text><circle cx="90" cy="575" r="26" class="dfr" /><text x="90" y="635" font-size="22" class="dt2" text-anchor="middle">red</text><circle cx="280" cy="575" r="26" class="dfg" /><text x="280" y="635" font-size="22" class="dt2" text-anchor="middle">green</text><circle cx="470" cy="575" r="26" class="dfb" /><text x="470" y="635" font-size="22" class="dt2" text-anchor="middle">blue</text>
</svg>
