<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Bremsstrahlung</text><g transform="translate(0 60)"><circle cx="300" cy="200" r="22" class="dfr dsr" fill-opacity=".7" stroke-width="3"/><text x="300" y="242" font-size="22" class="dt" text-anchor="middle">nucleus</text><path d="M20 195Q260 190 330 100" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M360 80q8-10 16 0t16 0t16 0t16 0" class="dsy" fill="none" stroke-width="3" /><text x="430" y="100" font-size="22" class="dty">highest energy</text><path d="M20 130Q300 140 520 100" class="dsb" fill="none" stroke-width="4" /><path d="M440 150q8-10 16 0t16 0t16 0t16 0" class="dsy" fill="none" stroke-width="3" /><text x="430" y="180" font-size="22" class="dty">medium</text><path d="M20 60Q300 60 560 30" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><text x="300" y="52" font-size="22" class="dty" text-anchor="middle">lowest energy (distant)</text></g><text x="14" y="380" font-size="22" class="dt2">Electrons that pass close to the nucleus bend</text><text x="14" y="410" font-size="22" class="dt2">hard and give high-energy photons; distant</text><text x="14" y="440" font-size="22" class="dt2">ones lose little. Together: a continuous</text><text x="14" y="470" font-size="22" class="dt2">X-ray spectrum.</text>
</svg>
