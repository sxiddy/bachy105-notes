<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Absorbance against concentration</text><path d="M80 60V400H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="434" font-size="22" font-weight="700" class="dt2" text-anchor="end">C</text><text x="92" y="68" font-size="22" font-weight="700" class="dt2">A</text><path d="M80 400L540 148" class="dsb" fill="none" stroke-width="5" /><path d="M463.18 190V400M463.18 190H80" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><circle cx="463.18" cy="190" r="8" class="dfw" /><text x="70" y="198" font-size="22" class="dt2" text-anchor="end">0.70</text><text x="463.18" y="436" font-size="22" class="dt2" text-anchor="middle">8.33</text><text x="130" y="190" font-size="22" font-weight="700" class="dtb">slope = εL</text><text x="14" y="484" font-size="22" class="dt2">C in units of 10⁻⁵ M. A rises in a straight</text><text x="14" y="514" font-size="22" class="dt2">line with C.</text><text x="14" y="544" font-size="22" class="dt2">Read C from A: 0.70 gives 8.33 × 10⁻⁵ M</text><text x="14" y="574" font-size="22" class="dt2">for ε = 8400 and L = 1 cm.</text>
