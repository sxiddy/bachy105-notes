<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Sol-gel: silicon alkoxide → network</text><circle cx="110" cy="140" r="34" class="df2 dsp" stroke-width="3.5"/><text x="110" y="149" font-size="24" font-weight="700" class="dt" text-anchor="middle">Si</text><path d="M110 140L110 60" class="ds" fill="none" stroke-width="3" /><rect x="82" y="42" width="56" height="36" class="dfb" rx="8" fill-opacity=".3"/><text x="110" y="68" font-size="22" font-weight="700" class="dtb" text-anchor="middle">OR</text><path d="M110 140L30 140" class="ds" fill="none" stroke-width="3" /><rect x="2" y="122" width="56" height="36" class="dfb" rx="8" fill-opacity=".3"/><text x="30" y="148" font-size="22" font-weight="700" class="dtb" text-anchor="middle">OR</text><path d="M110 140L110 220" class="ds" fill="none" stroke-width="3" /><rect x="82" y="202" width="56" height="36" class="dfb" rx="8" fill-opacity=".3"/><text x="110" y="228" font-size="22" font-weight="700" class="dtb" text-anchor="middle">OR</text><path d="M110 140L190 140" class="ds" fill="none" stroke-width="3" /><rect x="162" y="122" width="56" height="36" class="dfb" rx="8" fill-opacity=".3"/><text x="190" y="148" font-size="22" font-weight="700" class="dtb" text-anchor="middle">OR</text><text x="110" y="285" font-size="22" font-weight="700" class="dtb" text-anchor="middle">+ H₂O</text><path d="M240 140H340" class="dsw" fill="none" stroke-width="4" marker-end="url(#w)"/><text x="290" y="100" font-size="22" class="dt2" text-anchor="middle">hydrolysis,</text><text x="290" y="130" font-size="22" class="dt2" text-anchor="middle">condensation</text><circle cx="430" cy="100" r="22" class="df2 dsp" stroke-width="3"/><text x="430" y="108" font-size="22" font-weight="700" class="dt" text-anchor="middle">Si</text><circle cx="520" cy="100" r="22" class="df2 dsp" stroke-width="3"/><text x="520" y="108" font-size="22" font-weight="700" class="dt" text-anchor="middle">Si</text><circle cx="430" cy="190" r="22" class="df2 dsp" stroke-width="3"/><text x="430" y="198" font-size="22" font-weight="700" class="dt" text-anchor="middle">Si</text><circle cx="520" cy="190" r="22" class="df2 dsp" stroke-width="3"/><text x="520" y="198" font-size="22" font-weight="700" class="dt" text-anchor="middle">Si</text><path d="M452 100H498M430 122V168M520 122V168M452 190H498" class="ds" fill="none" stroke-width="4" /><text x="475" y="90" font-size="22" font-weight="700" class="dto" text-anchor="middle">O</text><text x="441" y="148" font-size="22" font-weight="700" class="dto" text-anchor="middle">O</text><text x="531" y="148" font-size="22" font-weight="700" class="dto" text-anchor="middle">O</text><text x="475" y="180" font-size="22" font-weight="700" class="dto" text-anchor="middle">O</text><path d="M430 78L430 60" class="ds" fill="none" stroke-width="3" /><text x="430" y="54" font-size="22" font-weight="700" class="dtr" text-anchor="middle">OH</text><path d="M520 78L520 60" class="ds" fill="none" stroke-width="3" /><text x="520" y="54" font-size="22" font-weight="700" class="dtr" text-anchor="middle">OH</text><path d="M430 212L430 232" class="ds" fill="none" stroke-width="3" /><text x="430" y="256" font-size="22" font-weight="700" class="dtr" text-anchor="middle">OH</text><path d="M520 212L520 232" class="ds" fill="none" stroke-width="3" /><text x="520" y="256" font-size="22" font-weight="700" class="dtr" text-anchor="middle">OH</text><text x="14" y="360" font-size="22" class="dt2">Water splits the alkoxy groups (OR) off</text><text x="14" y="390" font-size="22" class="dt2">silicon. Neighbouring Si link through</text><text x="14" y="420" font-size="22" class="dt2">O to form a branching Si–O–Si (siloxane)</text><text x="14" y="450" font-size="22" class="dt2">network with leftover –OH: the gel starts.</text>
