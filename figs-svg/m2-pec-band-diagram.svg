<text x="120" y="28" font-size="24" font-weight="700" class="dt" text-anchor="middle">Semiconductor</text><text x="120" y="58" font-size="24" font-weight="700" class="dt" text-anchor="middle">electrode</text><text x="310" y="28" font-size="24" font-weight="700" class="dt" text-anchor="middle">Electrolyte</text><text x="490" y="28" font-size="24" font-weight="700" class="dt" text-anchor="middle">Counter-</text><text x="490" y="58" font-size="24" font-weight="700" class="dt" text-anchor="middle">electrode</text><rect x="20" y="90" width="200" height="380" class="dfo" fill-opacity=".25"/><rect x="220" y="90" width="180" height="380" class="dfb" fill-opacity=".3"/><rect x="400" y="90" width="180" height="380" class="df3" fill-opacity=".4"/><path d="M60 230H110C150 230 170 190 220 170" class="ds" fill="none" stroke-width="5" /><path d="M60 400H110C150 400 170 360 220 340" class="ds" fill="none" stroke-width="5" /><text x="24" y="238" font-size="22" font-weight="700" class="dt">Ec</text><text x="24" y="408" font-size="22" font-weight="700" class="dt">Ev</text><path d="M30 330q8-12 16 0t16 0t16 0" class="dsy" fill="none" stroke-width="3" marker-end="url(#y)"/><text x="30" y="366" font-size="22" font-weight="700" class="dty">hν</text><path d="M96 394V240" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><path d="M90 232Q70 216 52 232" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="70" y="208" font-size="22" font-weight="700" class="dtb">e⁻</text><path d="M104 394Q150 394 190 354" class="dsr" fill="none" stroke-width="3" marker-end="url(#r)"/><text x="150" y="430" font-size="22" font-weight="700" class="dtr" text-anchor="middle">h⁺</text><text x="310" y="220" font-size="26" font-weight="700" class="dt" text-anchor="middle">Red</text><text x="310" y="380" font-size="26" font-weight="700" class="dt" text-anchor="middle">Ox</text><path d="M262 240Q246 300 262 358" class="dsr" fill="none" stroke-width="3" marker-end="url(#r)"/><path d="M358 358Q374 300 358 240" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="490" y="280" font-size="22" font-weight="700" class="dtb" text-anchor="middle">e⁻</text><path d="M420 300H560" class="ds" fill="none" stroke-width="3" stroke-dasharray="8 6"/><path d="M120 470V520H270M330 520H490V470" class="ds" fill="none" stroke-width="4" /><circle cx="300" cy="520" r="30" class="df2 ds" stroke-width="4"/><path d="M285 534L316 506" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><path d="M130 500H175" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="14" y="590" font-size="22" class="dt2">Photon lifts an electron from Ev to Ec.</text><text x="14" y="620" font-size="22" class="dt2">The band bend sends the electron to the bulk</text><text x="14" y="650" font-size="22" class="dt2">(then through the meter) and the hole to the</text><text x="14" y="680" font-size="22" class="dt2">surface.</text><text x="14" y="730" font-size="22" class="dt mono">At the surface: Red + h⁺ → Ox</text><text x="14" y="760" font-size="22" class="dt mono">At the counter-electrode: Ox + e⁻ → Red</text>
