<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">A potential energy surface</text><ellipse cx="150" cy="200" rx="30" ry="18" class="ds2" fill="none" stroke-width="2.5"/><ellipse cx="150" cy="200" rx="62" ry="38" class="ds2" fill="none" stroke-width="2.5"/><ellipse cx="150" cy="200" rx="92" ry="60" class="ds2" fill="none" stroke-width="2.5"/><ellipse cx="450" cy="200" rx="30" ry="18" class="ds2" fill="none" stroke-width="2.5"/><ellipse cx="450" cy="200" rx="62" ry="38" class="ds2" fill="none" stroke-width="2.5"/><ellipse cx="450" cy="200" rx="92" ry="60" class="ds2" fill="none" stroke-width="2.5"/><path d="M215 70C250 110 350 110 385 70M225 120C260 150 340 150 375 120M215 330C250 290 350 290 385 330M225 280C260 250 340 250 375 280" class="ds3" fill="none" stroke-width="2.5" /><path d="M150 200H300H450" class="dso" fill="none" stroke-width="4" stroke-dasharray="8 6"/><path d="M360 200H410" class="dso" fill="none" stroke-width="5" marker-end="url(#o)"/><circle cx="150" cy="200" r="8" class="dfw" /><circle cx="300" cy="200" r="8" class="dfr" /><circle cx="450" cy="200" r="8" class="dfw" /><text x="150" y="296" font-size="22" font-weight="700" class="dt" text-anchor="middle">reactant</text><text x="450" y="296" font-size="22" font-weight="700" class="dt" text-anchor="middle">product</text><text x="300" y="246" font-size="22" font-weight="700" class="dtr" text-anchor="middle">saddle</text><text x="300" y="268" font-size="22" font-weight="700" class="dtr" text-anchor="middle">(TS)</text><text x="14" y="396" font-size="22" class="dt2">Contours of energy against two coordinates.</text><text x="14" y="426" font-size="22" class="dt2">Two valleys are minima; the pass between</text><text x="14" y="456" font-size="22" class="dt2">them is the saddle point (transition state).</text>
