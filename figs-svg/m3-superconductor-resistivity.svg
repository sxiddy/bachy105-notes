<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Resistivity near T c</text><path d="M80 60V400H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="434" font-size="22" font-weight="700" class="dt2" text-anchor="end">T</text><text x="92" y="68" font-size="22" font-weight="700" class="dt2">ρ</text><path d="M80 300C200 290 300 235 540 110" class="dsb" fill="none" stroke-width="5" /><path d="M80 400H260" class="dsg" fill="none" stroke-width="6" /><path d="M260 400V287" class="dsg" fill="none" stroke-width="6" /><path d="M260 400V400" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><path d="M260 287C340 252 420 200 540 110" class="dsb" fill="none" stroke-width="5" stroke-opacity="0" /><path d="M260 287V400" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><text x="260" y="434" font-size="22" font-weight="700" class="dt" text-anchor="middle">T c</text><text x="100" y="190" font-size="22" font-weight="700" class="dtb">normal metal: levels off</text><text x="100" y="218" font-size="22" font-weight="700" class="dtb">at a finite ρ</text><text x="276" y="380" font-size="22" font-weight="700" class="dtg">superconductor: ρ = 0</text><text x="14" y="480" font-size="22" class="dt2">Below T c the resistivity drops to zero.</text><text x="14" y="510" font-size="22" class="dt2">Mercury: T c = 4 K.</text>
