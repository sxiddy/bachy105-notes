<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Parts of an azo dye</text><rect x="20" y="120" width="150" height="90" class="df2 ds" rx="10" fill-opacity=".3" stroke-width="3"/><text x="95" y="173" font-size="24" class="dt" text-anchor="middle">ring system</text><rect x="430" y="120" width="150" height="90" class="df2 ds" rx="10" fill-opacity=".3" stroke-width="3"/><text x="505" y="173" font-size="24" class="dt" text-anchor="middle">ring system</text><path d="M170 165H240M360 165H430" class="ds" fill="none" stroke-width="4" /><circle cx="300" cy="165" r="52" class="dfr dsr" fill-opacity=".25" stroke-width="4"/><text x="300" y="173" font-size="26" font-weight="700" class="dtr" text-anchor="middle">–N=N–</text><path d="M95 120V100" class="ds" fill="none" stroke-width="3" /><rect x="33" y="40" width="124" height="50" class="dfb dsb" rx="25" fill-opacity=".3" stroke-width="3"/><text x="95" y="74" font-size="22" class="dtb" text-anchor="middle">SO₃⁻Na⁺</text><path d="M505 120V100" class="ds" fill="none" stroke-width="3" /><rect x="443" y="40" width="124" height="50" class="dfb dsb" rx="25" fill-opacity=".3" stroke-width="3"/><text x="505" y="74" font-size="22" class="dtb" text-anchor="middle">SO₃⁻Na⁺</text><path d="M505 210V240" class="ds" fill="none" stroke-width="3" /><rect x="443" y="250" width="124" height="50" class="dfb dsb" rx="25" fill-opacity=".3" stroke-width="3"/><text x="505" y="284" font-size="22" class="dtb" text-anchor="middle">SO₃⁻Na⁺</text><rect x="10" y="105" width="580" height="120" class="ds2" fill="none" rx="16" stroke-dasharray="8 6" stroke-width="3"/><text x="300" y="98" font-size="22" class="dt2"></text><text x="14" y="350" font-size="22" class="dt2">red: chromophore (–N=N–), makes the colour</text><text x="14" y="380" font-size="22" class="dt2">blue: auxochromes (–SO₃⁻Na⁺), deepen it</text><text x="14" y="410" font-size="22" class="dt2">dashed: chromogen (rings + chromophore)</text>
