<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Resistance of a wire</text><rect x="100" y="110" width="340" height="100" class="dfo dso" rx="10" fill-opacity=".25" stroke-width="4"/><ellipse cx="440" cy="160" rx="22" ry="50" class="dfo dso" fill-opacity=".45" stroke-width="4"/><path d="M30 160H90" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><text x="60" y="140" font-size="22" font-weight="700" class="dtr" text-anchor="middle">I</text><path d="M470 160H560" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><path d="M270 240H100" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><path d="M270 240H438" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="270" y="276" font-size="22" font-weight="700" class="dt" text-anchor="middle">length l</text><text x="440" y="94" font-size="22" font-weight="700" class="dt" text-anchor="middle">area A</text><text x="300" y="350" font-size="30" font-weight="700" class="dt mono" text-anchor="middle">R = ρ l / A</text><text x="14" y="400" font-size="22" class="dt2">Longer wire: more resistance.</text><text x="14" y="430" font-size="22" class="dt2">Thicker wire: less resistance.</text><text x="14" y="460" font-size="22" class="dt2">ρ is the material, free of shape.</text>
