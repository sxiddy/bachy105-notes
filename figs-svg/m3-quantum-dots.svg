<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">A quantum dot, layer by layer</text><circle cx="300" cy="200" r="100" class="dfw" fill-opacity=".12" stroke-width="3" stroke="none"/><circle cx="300" cy="200" r="100" class="dsw" fill="none" stroke-width="3" stroke-dasharray="8 6"/><circle cx="300" cy="200" r="72" class="dfr dsr" fill-opacity=".45" stroke-width="3"/><circle cx="300" cy="200" r="36" class="dfb dsb" fill-opacity=".7" stroke-width="3"/><path d="M20 200q8-10 16 0t16 0t16 0t16 0" class="dsb" fill="none" stroke-width="4" /><path d="M84 200H110" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M500 200q8-10 16 0t16 0t16 0t16 0" class="dsr" fill="none" stroke-width="4" /><text x="60" y="245" font-size="22" class="dtb" text-anchor="middle">short</text><text x="540" y="245" font-size="22" class="dtr" text-anchor="middle">longer</text><text x="14" y="350" font-size="22" class="dt">centre: semiconductor core (blue)</text><text x="14" y="380" font-size="22" class="dt">QD shell around it (red)</text><text x="14" y="410" font-size="22" class="dt">outer protective shell (dashed)</text><text x="14" y="460" font-size="22" class="dt2">Short-wavelength light in, longer-wavelength</text><text x="14" y="490" font-size="22" class="dt2">glow out.</text>
