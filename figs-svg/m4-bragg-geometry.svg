<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Bragg's law geometry</text><path d="M40 200H560M40 290H560" class="ds" fill="none" stroke-width="4" /><text x="560" y="188" font-size="22" class="dt" text-anchor="end">(hkl)</text><text x="560" y="318" font-size="22" class="dt" text-anchor="end">(hkl)</text><path d="M150 80L296 197" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M150 170L296 287" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M304 197L450 80" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M304 287L450 170" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M300 200L256 255M300 200L344 255" class="dsr" fill="none" stroke-width="3" /><path d="M256 255L300 290L344 255" class="dsr" fill="none" stroke-width="6" /><text x="300" y="188" font-size="22" font-weight="700" class="dt" text-anchor="middle">A</text><text x="300" y="318" font-size="22" font-weight="700" class="dt" text-anchor="middle">B</text><text x="236" y="262" font-size="22" font-weight="700" class="dt" text-anchor="middle">C</text><text x="364" y="262" font-size="22" font-weight="700" class="dt" text-anchor="middle">D</text><path d="M510 205V285" class="dsy" fill="none" stroke-width="3" marker-end="url(#y)" marker-start="url(#y)"/><text x="525" y="250" font-size="22" font-weight="700" class="dty">d</text><text x="220" y="190" font-size="22" font-weight="700" class="dty">θ</text><text x="14" y="380" font-size="22" class="dt2">The lower ray travels extra CB + BD,</text><text x="14" y="410" font-size="22" class="dt2">each equal to d sin θ: 2d sin θ in all.</text><text x="14" y="440" font-size="22" class="dt2"></text><text x="14" y="470" font-size="22" class="dt2">Path difference nλ: the waves reinforce.</text><text x="14" y="500" font-size="22" class="dt2">Anything else: they cancel.</text><text x="14" y="570" font-size="28" font-weight="700" class="dt mono">2d sin θ = nλ</text>
</svg>
