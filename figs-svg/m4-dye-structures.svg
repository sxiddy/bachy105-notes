<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Two dyes</text><text x="14" y="80" font-size="26" font-weight="700" class="dtb">Methylene blue</text><path d="M140 130l30-18 30 18v34l-30 18-30-18z" class="dfb dsb" fill-opacity=".3" stroke-width="3"/><path d="M270 130l30-18 30 18v34l-30 18-30-18z" class="dfb dsb" fill-opacity=".3" stroke-width="3"/><path d="M400 130l30-18 30 18v34l-30 18-30-18z" class="dfb dsb" fill-opacity=".3" stroke-width="3"/><text x="300" y="156" font-size="22" font-weight="700" class="dt" text-anchor="middle">S  N⁺</text><text x="10" y="156" font-size="22" class="dtb">N(CH₃)₂</text><text x="472" y="156" font-size="22" class="dtb">N(CH₃)₂</text><text x="14" y="230" font-size="22" class="dt2">a three-ring cation with two</text><text x="14" y="260" font-size="22" class="dt2">dimethylamino groups</text><path d="M0 290H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="330" font-size="26" font-weight="700" class="dtr">Congo red</text><path d="M14 380l25-15 25 15v28l-25 15-25-15z" class="dfp" fill-opacity=".35" stroke-width="3" stroke="currentColor"/><path d="M114 380l25-15 25 15v28l-25 15-25-15z" class="dfo" fill-opacity=".35" stroke-width="3" stroke="currentColor"/><path d="M214 380l25-15 25 15v28l-25 15-25-15z" class="dfo" fill-opacity=".35" stroke-width="3" stroke="currentColor"/><path d="M314 380l25-15 25 15v28l-25 15-25-15z" class="dfp" fill-opacity=".35" stroke-width="3" stroke="currentColor"/><text x="300" y="452" font-size="22" class="dt2"></text><text x="14" y="480" font-size="22" class="dt2">bis-azo dye: a biphenyl centre with an</text><text x="14" y="510" font-size="22" class="dt2">–N=N– link on each side to sulfonated</text><text x="14" y="540" font-size="22" class="dt2">naphthylamine ends (–SO₃⁻).</text><text x="14" y="590" font-size="22" font-weight="700" class="dt">Both have long conjugated systems that absorb</text><text x="14" y="620" font-size="22" font-weight="700" class="dt">in the visible.</text>
