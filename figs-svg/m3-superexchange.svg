<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Superexchange in NiO</text><circle cx="110" cy="160" r="52" class="dfb dsb" fill-opacity=".3" stroke-width="4"/><text x="110" y="236" font-size="24" font-weight="700" class="dt" text-anchor="middle">Ni²⁺</text><circle cx="300" cy="160" r="62" class="dfr dsr" fill-opacity=".3" stroke-width="4"/><text x="300" y="250" font-size="24" font-weight="700" class="dt" text-anchor="middle">O²⁻</text><circle cx="490" cy="160" r="52" class="dfb dsb" fill-opacity=".3" stroke-width="4"/><text x="490" y="236" font-size="24" font-weight="700" class="dt" text-anchor="middle">Ni²⁺</text><path d="M110 190V130" class="dsb" fill="none" stroke-width="5" marker-end="url(#b)"/><path d="M274 130V190" class="dso" fill="none" stroke-width="5" marker-end="url(#o)"/><path d="M326 190V130" class="dsb" fill="none" stroke-width="5" marker-end="url(#b)"/><path d="M490 130V190" class="dso" fill="none" stroke-width="5" marker-end="url(#o)"/><text x="14" y="320" font-size="22" class="dt2">The two Ni ions never touch. The O²⁻</text><text x="14" y="350" font-size="22" class="dt2">between them passes the spin along the line.</text><text x="14" y="380" font-size="22" class="dt2">The paired spins on oxygen force the two</text><text x="14" y="410" font-size="22" class="dt2">Ni spins to point opposite ways.</text>
</svg>
