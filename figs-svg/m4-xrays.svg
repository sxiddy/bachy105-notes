<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Where X-rays sit</text><rect x="30" y="66" width="80" height="50" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="70" y="98" font-size="22" class="dt" text-anchor="middle">visible</text><rect x="110" y="66" width="90" height="50" class="dfb dsb" fill-opacity=".4" stroke-width="3"/><text x="155" y="98" font-size="22" class="dt" text-anchor="middle">UV</text><rect x="200" y="66" width="120" height="50" class="dfp dsp" fill-opacity=".4" stroke-width="3"/><text x="260" y="98" font-size="22" class="dt" text-anchor="middle">soft X</text><rect x="320" y="66" width="130" height="50" class="dfr dsr" fill-opacity=".4" stroke-width="3"/><text x="385" y="98" font-size="22" class="dt" text-anchor="middle">hard X</text><rect x="450" y="66" width="120" height="50" class="dfw dsw" fill-opacity=".4" stroke-width="3"/><text x="510" y="98" font-size="22" class="dt" text-anchor="middle">γ</text><path d="M30 150H570" class="dsy" fill="none" stroke-width="3" marker-end="url(#y)"/><text x="30" y="190" font-size="22" class="dt3">longer λ, lower energy</text><text x="570" y="190" font-size="22" class="dt3" text-anchor="end">shorter λ, higher energy</text><text x="14" y="260" font-size="22" class="dt2">Soft X-rays border the UV;</text><text x="14" y="290" font-size="22" class="dt2">hard X-rays run into gamma rays.</text><text x="14" y="350" font-size="22" class="dt">Each use works in its own slice of</text><text x="14" y="380" font-size="22" class="dt">photon energy:</text><rect x="30" y="410" width="300" height="50" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="180" y="443" font-size="24" class="dt" text-anchor="middle">X-ray crystallography</text><rect x="30" y="474" width="300" height="50" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="180" y="507" font-size="24" class="dt" text-anchor="middle">mammography</text><rect x="30" y="538" width="300" height="50" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="180" y="571" font-size="24" class="dt" text-anchor="middle">medical CT</text><rect x="30" y="602" width="300" height="50" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="180" y="635" font-size="24" class="dt" text-anchor="middle">airport security</text>
</svg>
