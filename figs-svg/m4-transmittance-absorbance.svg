<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Transmittance against absorbance</text><path d="M80 60V400H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="434" font-size="22" font-weight="700" class="dt2" text-anchor="end">A</text><text x="92" y="68" font-size="22" font-weight="700" class="dt2">%T</text><path d="M80.0 100.0L87.7 125.3L95.3 148.5L103.0 169.8L110.7 189.2L118.3 207.0L126.0 223.3L133.7 238.3L141.3 251.9L149.0 264.4L156.7 275.9L164.3 286.4L172.0 296.0L179.7 304.8L187.3 312.8L195.0 320.2L202.7 326.9L210.3 333.1L218.0 338.7L225.7 343.9L233.3 348.7L241.0 353.0L248.7 357.0L256.3 360.6L264.0 363.9L271.7 367.0L279.3 369.8L287.0 372.3L294.7 374.7L302.3 376.8L310.0 378.8L317.7 380.6L325.3 382.2L333.0 383.7L340.7 385.1L348.3 386.3L356.0 387.5L363.7 388.6L371.3 389.5L379.0 390.4L386.7 391.2L394.3 392.0L402.0 392.6L409.7 393.3L417.3 393.8L425.0 394.3L432.7 394.8L440.3 395.3L448.0 395.7L455.7 396.0L463.3 396.4L471.0 396.7L478.7 397.0L486.3 397.2L494.0 397.4L501.7 397.7L509.3 397.9L517.0 398.0L524.7 398.2L532.3 398.4L540.0 398.5" class="dso" fill="none" stroke-width="5" /><circle cx="80" cy="100" r="7" class="dfw" /><path d="M80 100V400" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><text x="80" y="436" font-size="22" class="dt2" text-anchor="middle">0</text><text x="94" y="130" font-size="22" font-weight="700" class="dt">100%</text><circle cx="280" cy="370" r="7" class="dfw" /><path d="M280 370V400" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><text x="280" y="436" font-size="22" class="dt2" text-anchor="middle">1</text><text x="294" y="358" font-size="22" font-weight="700" class="dt">10%</text><circle cx="480" cy="397" r="7" class="dfw" /><path d="M480 397V400" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="436" font-size="22" class="dt2" text-anchor="middle">2</text><text x="494" y="385" font-size="22" font-weight="700" class="dt">1%</text><text x="14" y="484" font-size="22" class="dt2">A = −log T, so each extra unit of A</text><text x="14" y="514" font-size="22" class="dt2">cuts the transmitted light tenfold.</text>
</svg>
