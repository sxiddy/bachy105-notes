<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<rect x="120" y="10" width="360" height="50" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="43" font-size="24" class="dt" text-anchor="middle">Dielectric coolants</text><path d="M40 60V566" class="ds" fill="none" stroke-width="4" /><path d="M40 112H70" class="ds" fill="none" stroke-width="3" /><rect x="70" y="90" width="500" height="44" class="dfp dsp" rx="10" fill-opacity=".3" stroke-width="3"/><text x="320" y="120" font-size="24" class="dt" text-anchor="middle">Aromatics</text><text x="90" y="164" font-size="22" class="dt2">• e.g. synthetic aromatic oils</text><path d="M40 226H70" class="ds" fill="none" stroke-width="3" /><rect x="70" y="204" width="500" height="44" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="320" y="234" font-size="24" class="dt" text-anchor="middle">Aliphatic</text><text x="90" y="278" font-size="22" class="dt2">• e.g. mineral / hydrocarbon oils</text><path d="M40 340H70" class="ds" fill="none" stroke-width="3" /><rect x="70" y="318" width="500" height="44" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="320" y="348" font-size="24" class="dt" text-anchor="middle">Fluorocarbons</text><text x="90" y="392" font-size="22" class="dt2">• split into two:</text><text x="90" y="422" font-size="22" class="dt2">• HFE: hydrofluoroethers</text><text x="90" y="452" font-size="22" class="dt2">• PFC: perfluorocarbons</text><path d="M40 514H70" class="ds" fill="none" stroke-width="3" /><rect x="70" y="492" width="500" height="44" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="320" y="522" font-size="24" class="dt" text-anchor="middle">Silicones</text><text x="90" y="566" font-size="22" class="dt2">• e.g. silicone oils</text>
