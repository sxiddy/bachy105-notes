<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 630">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Three more QD routes</text><path d="M0 50H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="84" font-size="26" font-weight="700" class="dt">1  Hydrothermal</text><text x="14" y="116" font-size="22" class="dt2">Teflon-lined stainless</text><text x="14" y="146" font-size="22" class="dt2">steel autoclave</text><g transform="translate(360 50)"><rect x="0" y="30" width="180" height="120" class="dfw" rx="10" fill-opacity=".2" stroke-width="3"/><rect x="25" y="55" width="130" height="70" class="dfb" fill-opacity=".4"/><text x="90" y="100" font-size="22" class="dt" text-anchor="middle">liner</text></g><path d="M0 240H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="274" font-size="26" font-weight="700" class="dt">2  Microwave</text><text x="14" y="306" font-size="22" class="dt2">lab microwave reactor</text><g transform="translate(360 240)"><rect x="0" y="40" width="180" height="100" class="df3 ds" rx="10" stroke-width="3"/><circle cx="90" cy="90" r="28" class="dfo" fill-opacity=".5"/><path d="M40 90q8-10 16 0t16 0t16 0t16 0" class="dsy" fill="none" stroke-width="3" /></g><path d="M0 430H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="464" font-size="26" font-weight="700" class="dt">3  Ultrasound</text><text x="14" y="496" font-size="22" class="dt2">ultrasonic probe</text><text x="14" y="526" font-size="22" class="dt2">in a beaker, ~15 min</text><g transform="translate(360 430)"><path d="M90 20V90" class="dsw" fill="none" stroke-width="8" /><path d="M30 80V150H150V80" class="dfb dsb" fill-opacity=".3" stroke-width="3" /><path d="M50 125q8-10 16 0t16 0t16 0t16 0t16 0" class="dsy" fill="none" stroke-width="3" /></g>
</svg>
