<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">The electromagnetic spectrum</text><rect x="90" y="60" width="480" height="44" class="dfr dsr" rx="8" fill-opacity=".4" stroke-width="3"/><text x="330" y="91" font-size="24" class="dt" text-anchor="middle">radio waves</text><rect x="90" y="116" width="480" height="44" class="dfo dso" rx="8" fill-opacity=".4" stroke-width="3"/><text x="330" y="147" font-size="24" class="dt" text-anchor="middle">microwaves</text><rect x="90" y="172" width="480" height="44" class="dfy dsy" rx="8" fill-opacity=".4" stroke-width="3"/><text x="330" y="203" font-size="24" class="dt" text-anchor="middle">infrared</text><rect x="90" y="228" width="480" height="44" class="dfg dsg" rx="8" fill-opacity=".4" stroke-width="3"/><text x="330" y="259" font-size="24" font-weight="700" class="dt" text-anchor="middle">visible</text><rect x="90" y="284" width="480" height="44" class="dfb dsb" rx="8" fill-opacity=".4" stroke-width="3"/><text x="330" y="315" font-size="24" class="dt" text-anchor="middle">ultraviolet</text><rect x="90" y="340" width="480" height="44" class="dfp dsp" rx="8" fill-opacity=".4" stroke-width="3"/><text x="330" y="371" font-size="24" class="dt" text-anchor="middle">X-rays</text><rect x="90" y="396" width="480" height="44" class="dfw dsw" rx="8" fill-opacity=".4" stroke-width="3"/><text x="330" y="427" font-size="24" class="dt" text-anchor="middle">gamma rays</text><path d="M45 440V66" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M30 66V70" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><text x="14" y="480" font-size="22" class="dt2">Wavelength falls from ≈ 10³ m (radio) to</text><text x="14" y="510" font-size="22" class="dt2">10⁻¹² m (gamma); frequency rises from</text><text x="14" y="540" font-size="22" class="dt2">10⁴ to 10²⁰ Hz. Visible light is a narrow</text><text x="14" y="570" font-size="22" class="dt2">band near the middle.</text>
</svg>
