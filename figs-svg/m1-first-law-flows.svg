<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Energy in and out of a system</text><rect x="190" y="150" width="220" height="120" class="dfb dsb" rx="12" fill-opacity=".25" stroke-width="4"/><text x="300" y="200" font-size="26" font-weight="700" class="dt" text-anchor="middle">system</text><text x="300" y="238" font-size="24" class="dt mono" text-anchor="middle">ΔU = q + w</text><path d="M20 210H180" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><text x="100" y="190" font-size="22" font-weight="700" class="dtr" text-anchor="middle">q in (+)</text><path d="M300 76V140" class="dso" fill="none" stroke-width="5" marker-end="url(#o)"/><text x="300" y="66" font-size="22" font-weight="700" class="dto" text-anchor="middle">w on system (+)</text><path d="M420 210H580" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><text x="500" y="190" font-size="22" font-weight="700" class="dtr" text-anchor="middle">q out (−)</text><path d="M300 280V340" class="dso" fill="none" stroke-width="5" marker-end="url(#o)"/><text x="300" y="372" font-size="22" font-weight="700" class="dto" text-anchor="middle">w by system (−)</text><text x="14" y="420" font-size="22" class="dt2">Energy in raises U; energy out lowers it.</text><text x="14" y="450" font-size="22" class="dt2">q is heat, w is work, both counted from</text><text x="14" y="480" font-size="22" class="dt2">the system side.</text>
</svg>
