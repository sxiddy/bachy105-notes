<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Metal resistivity against T</text><path d="M80 60V400H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="434" font-size="22" font-weight="700" class="dt2" text-anchor="end">T</text><text x="92" y="68" font-size="22" font-weight="700" class="dt2">ρ</text><path d="M110 300L540 150" class="dsb" fill="none" stroke-width="5" /><path d="M110 220L540 70" class="dsr" fill="none" stroke-width="5" /><path d="M110 300V400M110 220V300" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><path d="M330 214V176" class="dsy" fill="none" stroke-width="3" marker-end="url(#y)"/><path d="M24 463H70" class="dsb" fill="none" stroke-width="5" /><text x="82" y="470" font-size="22" class="dt">pure metal: rises with T</text><path d="M24 497H70" class="dsr" fill="none" stroke-width="5" /><text x="82" y="504" font-size="22" class="dt">with impurities: shifted up</text><text x="14" y="550" font-size="22" class="dt2">Impurities scatter electrons, so ρ is higher</text><text x="14" y="580" font-size="22" class="dt2">at every temperature.</text>
