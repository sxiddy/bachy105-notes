<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Dye-sensitised solar cell (Grätzel)</text><rect x="70" y="150" width="36" height="200" class="df3 ds" stroke-width="2"/><rect x="106" y="150" width="74" height="200" class="dfw" fill-opacity=".25"/><rect x="180" y="150" width="260" height="200" class="dfb" fill-opacity=".25"/><rect x="440" y="150" width="36" height="200" class="df3 ds" stroke-width="2"/><circle cx="126" cy="175" r="10" class="dfr" /><circle cx="160" cy="187" r="10" class="dfr" /><circle cx="126" cy="215" r="10" class="dfr" /><circle cx="160" cy="227" r="10" class="dfr" /><circle cx="126" cy="255" r="10" class="dfr" /><circle cx="160" cy="267" r="10" class="dfr" /><circle cx="126" cy="295" r="10" class="dfr" /><circle cx="160" cy="307" r="10" class="dfr" /><circle cx="126" cy="335" r="10" class="dfr" /><circle cx="160" cy="347" r="10" class="dfr" /><path d="M14 200H64" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><path d="M14 270H64" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><path d="M14 320H64" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><text x="14" y="380" font-size="22" font-weight="700" class="dty">light</text><text x="74" y="142" font-size="22" class="dt2" text-anchor="middle">glass</text><text x="160" y="142" font-size="22" class="dt2" text-anchor="middle">TiO₂</text><text x="458" y="142" font-size="22" class="dt2" text-anchor="middle">Pt</text><path d="M88 150V90H260M340 90H458V150" class="ds" fill="none" stroke-width="4" /><circle cx="300" cy="90" r="30" class="df2 ds" stroke-width="4"/><path d="M286 104L314 76" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="210" y="215" font-size="26" font-weight="700" class="dtb">I⁻</text><text x="385" y="215" font-size="26" font-weight="700" class="dtb">I₃⁻</text><path d="M370 300Q300 330 230 300" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="126" y="130" font-size="22" class="dt2"></text><text x="14" y="430" font-size="22" class="dt2">1  dye S absorbs light, becomes S*</text><text x="14" y="460" font-size="22" class="dt2">2  S* injects an electron into TiO₂</text><text x="14" y="490" font-size="22" class="dt2">3  e⁻ runs through glass, bulb, Pt</text><text x="14" y="520" font-size="22" class="dt2">4  I₃⁻ + 2e⁻ → 3I⁻ at the Pt electrode</text><text x="14" y="550" font-size="22" class="dt2">5  3I⁻ + 2S⁺ → I₃⁻ + 2S, dye is restored</text>
