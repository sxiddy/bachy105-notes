<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Two routes to nanoparticles</text><text x="14" y="70" font-size="26" font-weight="700" class="dtb">Top-down</text><rect x="40" y="94" width="270" height="52" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="175" y="128" font-size="24" class="dt" text-anchor="middle">bulk material</text><path d="M175 146V168" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="40" y="170" width="270" height="52" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="175" y="204" font-size="24" class="dt" text-anchor="middle">powder</text><path d="M175 222V244" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="40" y="246" width="270" height="52" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="175" y="280" font-size="24" class="dt" text-anchor="middle">nanoparticles</text><rect x="340" y="130" width="240" height="100" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="460" y="173" font-size="22" class="dt2" text-anchor="middle">methods, e.g.</text><text x="460" y="203" font-size="22" class="dt2" text-anchor="middle">ball milling</text><path d="M0 340H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="380" font-size="26" font-weight="700" class="dtg">Bottom-up</text><rect x="40" y="404" width="270" height="52" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="175" y="438" font-size="24" class="dt" text-anchor="middle">atoms / molecules</text><path d="M175 456V478" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="40" y="480" width="270" height="52" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="175" y="514" font-size="24" class="dt" text-anchor="middle">nuclei (clusters)</text><path d="M175 532V554" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="40" y="556" width="270" height="52" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="175" y="590" font-size="24" class="dt" text-anchor="middle">nanoparticles</text><rect x="340" y="440" width="240" height="100" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="460" y="483" font-size="22" class="dt2" text-anchor="middle">methods, e.g.</text><text x="460" y="513" font-size="22" class="dt2" text-anchor="middle">sol-gel, chemical growth</text>
