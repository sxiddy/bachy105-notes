<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Atom, small molecule, large molecule</text><text x="14" y="78" font-size="26" font-weight="700" class="dt">Atom</text><text x="14" y="108" font-size="22" class="dt2">one sharp line</text><path d="M40 280H560" class="ds" fill="none" stroke-width="3" /><path d="M300 280V140" class="dsb" fill="none" stroke-width="6" /><path d="M0 312H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="358" font-size="26" font-weight="700" class="dt">Small molecule</text><text x="14" y="388" font-size="22" class="dt2">a comb of vibrational peaks</text><path d="M40 560H560" class="ds" fill="none" stroke-width="3" /><path d="M150 560V480" class="dso" fill="none" stroke-width="5" /><path d="M200 560V460" class="dso" fill="none" stroke-width="5" /><path d="M250 560V440" class="dso" fill="none" stroke-width="5" /><path d="M300 560V420" class="dso" fill="none" stroke-width="5" /><path d="M350 560V440" class="dso" fill="none" stroke-width="5" /><path d="M400 560V460" class="dso" fill="none" stroke-width="5" /><path d="M450 560V480" class="dso" fill="none" stroke-width="5" /><path d="M0 592H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="638" font-size="26" font-weight="700" class="dt">Large molecule</text><text x="14" y="668" font-size="22" class="dt2">sub-levels blur into one broad band</text><path d="M40 840H560" class="ds" fill="none" stroke-width="3" /><path d="M60 840Q300 560 540 840" class="dfg dsg" fill-opacity=".3" stroke-width="5"/><path d="M0 872H600" class="ds3" fill="none" stroke-width="2" />
