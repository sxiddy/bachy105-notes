<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Why Cp is larger than Cv</text><text x="14" y="72" font-size="26" font-weight="700" class="dtb">Constant volume</text><rect x="40" y="96" width="150" height="114" class="dfb" fill-opacity=".2"/><path d="M40 86V210H190V86" class="ds" fill="none" stroke-width="5" /><path d="M32 96H198" class="dsw" fill="none" stroke-width="8" /><circle cx="126.3" cy="155.0" r="5" class="dfb" /><circle cx="100.6" cy="168.2" r="5" class="dfb" /><circle cx="117.2" cy="129.8" r="5" class="dfb" /><circle cx="133.2" cy="178.8" r="5" class="dfb" /><circle cx="81.6" cy="149.1" r="5" class="dfb" /><circle cx="146.7" cy="134.9" r="5" class="dfb" /><circle cx="104.4" cy="194.4" r="5" class="dfb" /><circle cx="94.8" cy="116.1" r="5" class="dfb" /><circle cx="158.8" cy="171.0" r="5" class="dfb" /><path d="M115 262V222" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><text x="115" y="290" font-size="22" class="dtr" text-anchor="middle">heat q</text><text x="225" y="140" font-size="22" class="dt">lid fixed, so w = 0</text><text x="225" y="170" font-size="22" class="dt">all the heat raises U</text><text x="225" y="200" font-size="22" class="dt">ΔU = q_v  gives Cv</text><text x="14" y="345" font-size="26" font-weight="700" class="dto">Constant pressure</text><rect x="40" y="396" width="150" height="94" class="dfb" fill-opacity=".2"/><path d="M40 366V490H190V366" class="ds" fill="none" stroke-width="5" /><path d="M32 396H198" class="dsw" fill="none" stroke-width="8" /><path d="M40 436H190" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><path d="M115 430V404" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><circle cx="125.0" cy="450.0" r="5" class="dfb" /><circle cx="102.2" cy="461.7" r="5" class="dfb" /><circle cx="117.0" cy="427.7" r="5" class="dfb" /><circle cx="131.1" cy="471.0" r="5" class="dfb" /><circle cx="85.5" cy="444.8" r="5" class="dfb" /><circle cx="143.0" cy="432.2" r="5" class="dfb" /><circle cx="105.6" cy="484.8" r="5" class="dfb" /><circle cx="97.1" cy="415.6" r="5" class="dfb" /><path d="M115 542V502" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><text x="115" y="572" font-size="22" class="dtr" text-anchor="middle">heat q</text><text x="225" y="420" font-size="22" class="dt">piston rises, gas does work</text><text x="225" y="450" font-size="22" class="dt">heat pays for U and for w</text><text x="225" y="480" font-size="22" class="dt">ΔH = q_p  gives Cp</text><text x="14" y="618" font-size="24" font-weight="700" class="dtg">Same ΔT, more heat needed: Cp > Cv</text>
</svg>
