<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Liquid cooling of electronics</text><rect x="30" y="60" width="180" height="76" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="120" y="91" font-size="22" class="dt" text-anchor="middle">cold plate</text><text x="120" y="121" font-size="22" class="dt" text-anchor="middle">on chip 1</text><rect x="30" y="170" width="180" height="76" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="120" y="201" font-size="22" class="dt" text-anchor="middle">cold plate</text><text x="120" y="231" font-size="22" class="dt" text-anchor="middle">on chip 2</text><rect x="390" y="70" width="180" height="56" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="480" y="106" font-size="22" class="dt" text-anchor="middle">heat exchanger</text><rect x="390" y="180" width="180" height="56" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="480" y="216" font-size="22" class="dt" text-anchor="middle">pump</text><path d="M210 98H390" class="dsr" fill="none" stroke-width="4" marker-end="url(#r)"/><text x="300" y="88" font-size="22" class="dtr" text-anchor="middle">hot liquid</text><path d="M480 126V180" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M390 208H300H210" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><text x="300" y="232" font-size="22" class="dtb" text-anchor="middle">cool liquid</text><text x="14" y="310" font-size="22" class="dt2">Cold plates sit on the chips; tubing carries</text><text x="14" y="340" font-size="22" class="dt2">the liquid to a heat exchanger, and a pump</text><text x="14" y="370" font-size="22" class="dt2">sends it back round.</text>
</svg>
