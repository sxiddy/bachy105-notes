<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Screening semiconductors with ML</text><rect x="70" y="60" width="460" height="96" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="88" font-size="24" font-weight="700" class="dt" text-anchor="middle">Data</text><text x="300" y="116" font-size="22" class="dt" text-anchor="middle">formation energy, lattice constants,</text><text x="300" y="144" font-size="22" class="dt" text-anchor="middle">density, total magnetisation</text><path d="M300 156V182" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="184" width="460" height="96" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="212" font-size="24" font-weight="700" class="dt" text-anchor="middle">Train models</text><text x="300" y="240" font-size="22" class="dt" text-anchor="middle">classification, regression,</text><text x="300" y="268" font-size="22" class="dt" text-anchor="middle">clustering</text><path d="M300 280V306" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="308" width="460" height="96" class="dfp dsp" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="350" font-size="24" font-weight="700" class="dt" text-anchor="middle">Tune</text><text x="300" y="378" font-size="22" class="dt" text-anchor="middle">optimise the hyperparameters</text><path d="M300 404V430" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="432" width="460" height="96" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="474" font-size="24" font-weight="700" class="dt" text-anchor="middle">Predict</text><text x="300" y="502" font-size="22" class="dt" text-anchor="middle">band gap (eV) of each material</text><path d="M300 528V554" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="556" width="460" height="96" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="598" font-size="24" font-weight="700" class="dt" text-anchor="middle">Rank</text><text x="300" y="626" font-size="22" class="dt" text-anchor="middle">top semiconductors and their gaps</text>
