<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">AI-driven screening workflow</text><rect x="70" y="58" width="460" height="84" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="96" font-size="22" font-weight="700" class="dt" text-anchor="middle">Define the goal</text><text x="300" y="124" font-size="18" class="dt2" text-anchor="middle">application and properties</text><path d="M300 142V164" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="166" width="460" height="84" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="204" font-size="22" font-weight="700" class="dt" text-anchor="middle">Collect data</text><text x="300" y="232" font-size="18" class="dt2" text-anchor="middle">databases, papers, calculations</text><path d="M300 250V272" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="274" width="460" height="84" class="dfp dsp" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="312" font-size="22" font-weight="700" class="dt" text-anchor="middle">Prepare data</text><text x="300" y="340" font-size="18" class="dt2" text-anchor="middle">clean, standardise, add descriptors</text><path d="M300 358V380" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="382" width="460" height="84" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="420" font-size="22" font-weight="700" class="dt" text-anchor="middle">Train the model</text><text x="300" y="448" font-size="18" class="dt2" text-anchor="middle">learn composition to property</text><path d="M300 466V488" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="490" width="460" height="84" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="528" font-size="22" font-weight="700" class="dt" text-anchor="middle">Screen candidates</text><text x="300" y="556" font-size="18" class="dt2" text-anchor="middle">predict and rank new materials</text><path d="M300 574V596" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="70" y="598" width="460" height="84" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="636" font-size="22" font-weight="700" class="dt" text-anchor="middle">Validate</text><text x="300" y="664" font-size="18" class="dt2" text-anchor="middle">high-level calculation and experiment</text>
