<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">The nanoscale</text><rect x="30" y="164" width="560" height="92" class="dfb dsb" rx="10" fill-opacity=".18" stroke-width="2"/><path d="M150 80V548" class="ds" fill="none" stroke-width="4" /><path d="M138 80H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="88" font-size="24" class="dt mono" text-anchor="end">10⁻¹</text><text x="182" y="88" font-size="24" class="dt2">Water molecule</text><path d="M138 132H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="140" font-size="24" class="dt mono" text-anchor="end">1</text><text x="182" y="140" font-size="24" class="dt2">Glucose</text><path d="M138 184H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="192" font-size="24" class="dt mono" text-anchor="end">10</text><text x="182" y="192" font-size="24" font-weight="700" class="dt">Antibody</text><path d="M138 236H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="244" font-size="24" class="dt mono" text-anchor="end">10²</text><text x="182" y="244" font-size="24" font-weight="700" class="dt">Virus</text><path d="M138 288H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="296" font-size="24" class="dt mono" text-anchor="end">10³</text><text x="182" y="296" font-size="24" class="dt2">Bacterium</text><path d="M138 340H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="348" font-size="24" class="dt mono" text-anchor="end">10⁴</text><text x="182" y="348" font-size="24" class="dt2">Cancer cell</text><path d="M138 392H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="400" font-size="24" class="dt mono" text-anchor="end">10⁵</text><path d="M138 444H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="452" font-size="24" class="dt mono" text-anchor="end">10⁶</text><text x="182" y="452" font-size="24" class="dt2">A full stop (.)</text><path d="M138 496H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="504" font-size="24" class="dt mono" text-anchor="end">10⁷</text><path d="M138 548H162" class="ds" fill="none" stroke-width="4" /><text x="126" y="556" font-size="24" class="dt mono" text-anchor="end">10⁸</text><text x="182" y="556" font-size="24" class="dt2">Tennis ball</text><text x="126" y="598" font-size="22" class="dt3">nanometres (log scale)</text><text x="560" y="192" font-size="22" font-weight="700" class="dtb" text-anchor="end">10–100 nm</text><rect x="40" y="628" width="520" height="230" class="dfb dsb" rx="12" fill-opacity=".12" stroke-width="3"/><text x="300" y="668" font-size="24" font-weight="700" class="dt" text-anchor="middle">Nanodevices (same size range)</text><text x="80" y="712" font-size="24" class="dt2">Nanopores</text><text x="80" y="742" font-size="24" class="dt2">Dendrimers</text><text x="80" y="772" font-size="24" class="dt2">Nanotubes</text><text x="330" y="712" font-size="24" class="dt2">Quantum dots</text><text x="330" y="742" font-size="24" class="dt2">Nanoshells</text><text x="330" y="772" font-size="24" class="dt2">Fullerenes</text><text x="300" y="833" font-size="22" class="dt3" text-anchor="middle">they work alongside antibodies and viruses</text>
