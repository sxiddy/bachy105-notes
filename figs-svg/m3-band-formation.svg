<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">How energy bands form</text><path d="M70 60V400H570" class="ds" fill="none" stroke-width="4" /><text x="92" y="76" font-size="22" font-weight="700" class="dt2">energy</text><text x="570" y="434" font-size="22" font-weight="700" class="dt2" text-anchor="end">atoms packed closer</text><path d="M110 130C190 130 230 95 350 95" class="dsb" fill="none" stroke-width="4" /><path d="M110 130C190 130 230 109 350 109" class="dsb" fill="none" stroke-width="4" /><path d="M110 130C190 130 230 123 350 123" class="dsb" fill="none" stroke-width="4" /><path d="M110 130C190 130 230 137 350 137" class="dsb" fill="none" stroke-width="4" /><path d="M110 130C190 130 230 151 350 151" class="dsb" fill="none" stroke-width="4" /><path d="M110 130C190 130 230 165 350 165" class="dsb" fill="none" stroke-width="4" /><path d="M110 290C190 290 230 255 350 255" class="dsg" fill="none" stroke-width="4" /><path d="M110 290C190 290 230 269 350 269" class="dsg" fill="none" stroke-width="4" /><path d="M110 290C190 290 230 283 350 283" class="dsg" fill="none" stroke-width="4" /><path d="M110 290C190 290 230 297 350 297" class="dsg" fill="none" stroke-width="4" /><path d="M110 290C190 290 230 311 350 311" class="dsg" fill="none" stroke-width="4" /><path d="M110 290C190 290 230 325 350 325" class="dsg" fill="none" stroke-width="4" /><rect x="344" y="85" width="12" height="90" class="dfb" fill-opacity=".25"/><rect x="344" y="245" width="12" height="90" class="dfg" fill-opacity=".25"/><text x="376" y="134" font-size="24" font-weight="700" class="dtb">upper band</text><text x="376" y="294" font-size="24" font-weight="700" class="dtg">lower band</text><text x="376" y="214" font-size="22" class="dt2">gap</text><text x="110" y="366" font-size="22" class="dt">single atom: one level each</text><text x="14" y="480" font-size="22" class="dt2">Neighbouring atoms shift each level</text><text x="14" y="510" font-size="22" class="dt2">up or down. Many close levels merge</text><text x="14" y="540" font-size="22" class="dt2">into a band; inner levels barely move.</text>
</svg>
