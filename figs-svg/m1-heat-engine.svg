<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">A heat engine</text><rect x="150" y="56" width="300" height="76" class="dfr dsr" rx="12" fill-opacity=".25" stroke-width="4"/><text x="300" y="104" font-size="24" font-weight="700" class="dt" text-anchor="middle">hot reservoir, T hot</text><path d="M300 138V200" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><text x="316" y="176" font-size="22" font-weight="700" class="dtr">Q hot</text><circle cx="300" cy="262" r="60" class="dfg dsg" fill-opacity=".25" stroke-width="4"/><text x="300" y="270" font-size="24" font-weight="700" class="dt" text-anchor="middle">engine</text><path d="M362 262H570" class="dsg" fill="none" stroke-width="5" marker-end="url(#g)"/><text x="466" y="244" font-size="22" font-weight="700" class="dtg" text-anchor="middle">work W</text><path d="M300 328V390" class="dsb" fill="none" stroke-width="5" marker-end="url(#b)"/><text x="316" y="366" font-size="22" font-weight="700" class="dtb">Q cold</text><rect x="150" y="396" width="300" height="76" class="dfb dsb" rx="12" fill-opacity=".25" stroke-width="4"/><text x="300" y="444" font-size="24" font-weight="700" class="dt" text-anchor="middle">cold reservoir, T cold</text><text x="14" y="516" font-size="22" class="dt2">The engine runs in a cycle.</text><text x="14" y="546" font-size="22" class="dt2">W = Q hot − Q cold (magnitudes)</text><text x="14" y="576" font-size="22" class="dt2">efficiency = W / Q hot</text>
