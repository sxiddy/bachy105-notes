<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Characteristic X-ray emission</text><circle cx="300" cy="200" r="140" class="ds3" fill="none" stroke-width="2"/><circle cx="300" cy="200" r="90" class="ds3" fill="none" stroke-width="2"/><circle cx="300" cy="200" r="45" class="ds3" fill="none" stroke-width="2"/><circle cx="300" cy="200" r="10" class="dfr" /><text x="300" y="130" font-size="22" font-weight="700" class="dt" text-anchor="middle">K</text><text x="300" y="105" font-size="22" font-weight="700" class="dt" text-anchor="middle">L</text><text x="300" y="58" font-size="22" font-weight="700" class="dt" text-anchor="middle">M</text><path d="M30 200L250 200" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><text x="40" y="180" font-size="22" class="dtb">incoming e⁻</text><circle cx="255" cy="215" r="8" class="dfb" /><path d="M262 210L330 270" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="340" y="290" font-size="22" class="dtb">ejected e⁻</text><path d="M250 190L180 120" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="60" y="110" font-size="22" class="dtb">scattered</text><circle cx="345" cy="175" r="8" class="dfb" /><path d="M345 175L318 213" class="dsb" fill="none" stroke-width="2" marker-end="url(#b)"/><path d="M400 100q8-10 16 0t16 0t16 0t16 0" class="dsy" fill="none" stroke-width="4" /><text x="480" y="100" font-size="22" font-weight="700" class="dty">X-ray</text><text x="14" y="400" font-size="22" class="dt2">The incoming electron ejects a K-shell electron.</text><text x="14" y="430" font-size="22" class="dt2">An outer electron falls into the hole and</text><text x="14" y="460" font-size="22" class="dt2">releases a characteristic X-ray photon.</text>
