<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner stats · BACHY105 Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  body { overflow-y: auto; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 36px 16px 80px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 22px 0 8px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpis > div { background: var(--bg-2); padding: 16px 18px; }
  .kpis .v { font-family: var(--serif); font-size: 32px; color: var(--white); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpis .l { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 10px 0 0; border-bottom: 1px solid var(--line-2); }
  .bars > div { flex: 1; background: var(--text-2); border-radius: 3px 3px 0 0; min-width: 4px; position: relative; }
  .bars > div:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font: 11px var(--mono); color: var(--white); background: var(--surface-2); padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
  .axis { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--text-faint); margin-top: 6px; }
  .fb { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); padding: 12px 16px; margin-bottom: 8px; }
  .fb small { font-family: var(--mono); color: var(--text-faint); }
  .fb p { margin: 6px 0 0; color: var(--text-2); white-space: pre-wrap; }
  .note { margin-top: 14px; }
  form.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  form.row input { height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--white); padding: 0 12px; font-family: var(--mono); min-width: 220px; }
  .funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 10px; }
  .funnel > div { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); padding: 14px 16px; display: grid; gap: 2px; }
  .funnel b { font-family: var(--serif); font-size: 28px; font-weight: 500; color: var(--white); line-height: 1.1; }
  .funnel span { font-size: 13.5px; color: var(--text-2); }
  .funnel em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  @media (max-width: 700px) { .funnel { grid-template-columns: repeat(2, 1fr); } }
  .look { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); padding: 6px 16px 14px; margin-top: 12px; }
  .look-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .look-row > span { color: var(--text-dim); font-size: 13.5px; }
  .look-row code { font-size: 12px; }
  .look-act { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 12px; }
  @media (max-width: 560px) { .look-row { grid-template-columns: 1fr; gap: 2px; } }
  .pill-tag { font: 11px var(--mono); border: 1px solid var(--line-2); border-radius: 99px; padding: 2px 8px; margin-left: 6px; color: var(--white); }
  .fb-act { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  textarea.ann { display: block; width: 100%; min-height: 70px; margin-top: 6px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--white); padding: 10px 12px; font: 15px/1.5 var(--sans); resize: vertical; box-sizing: border-box; }
  .srow { display: flex; gap: 8px; flex-wrap: wrap; }
  .srow input { height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--white); padding: 0 12px; font-family: var(--mono); }
  label.lim { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-dim); }
  form.row label.lim input { min-width: 0; width: 70px; }
  form.row label.lim input[type="checkbox"] { width: 16px; height: 16px; padding: 0; margin: 0; accent-color: #f4f4f6; }
  form.row label.lim:has(input[type="checkbox"]) { height: 38px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; color: var(--text-2); cursor: pointer; }
  .msg { font-size: 14px; color: var(--warn); min-height: 1.4em; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="code">Owner</span><span>BACHY105 Notes</span><span class="dot">·</span><a href="./" style="color:inherit">Back to the site</a></div>
  <h1 class="h-display" style="font-size:40px">Stats</h1>
  <div id="login">
    <p class="muted">Enter your admin key (the <code>ADMIN_KEY</code> you set in Vercel). It stays in this tab only.</p>
    <form class="row" id="f"><input id="k" type="password" placeholder="Admin key" autocomplete="current-password" required><button class="btn primary">Show stats</button></form>
    <p class="msg" id="lm"></p>
  </div>
  <div id="out" hidden></div>
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let key = ''; try { key = sessionStorage.getItem('bn_admin') || ''; } catch (e) {}
  async function call(method, data) {
    const r = await fetch('/api/stats', { method, headers: { 'x-admin-key': key, 'Content-Type': 'application/json' }, body: data ? JSON.stringify(data) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
    return j;
  }
  function days(obj, n) {
    const out = []; const d = new Date();
    for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setUTCDate(d.getUTCDate() - i); const k = x.toISOString().slice(0, 10); out.push([k, (obj && obj[k]) || 0]); }
    return out;
  }
  function bars(series) {
    const max = Math.max(1, ...series.map((s) => s[1]));
    return `<div class="bars">${series.map(([k, v]) => `<div style="height:${Math.max(2, (v / max) * 100)}%" data-tip="${k}: ${v}"></div>`).join('')}</div><div class="axis"><span>${series[0][0]}</span><span>${series[series.length - 1][0]}</span></div>`;
  }
  let fbFilter = 'open';
  const when = (s) => esc(String(s || '').replace('T', ' ').slice(0, 16));
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');
  const modName = (s, id) => { const m = (s.paidModules || []).find((x) => x.id === id); return m ? 'Module ' + (+m.num) : id; };
  const modsLabel = (s, mods) => (mods && mods.length ? mods.map((id) => modName(s, id)).join(', ') + ' only' : 'All modules');
  const tbl = (head, rows) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;

  function feedbackHTML(s) {
    const all = s.feedback || [];
    const n = (st) => all.filter((f) => f.status === st).length;
    const list = all.filter((f) => f.status === fbFilter);
    const tabs = [['open', 'Open'], ['fixed', 'Fixed'], ['ignored', 'Ignored']].map(([k, l]) => `<button class="btn small${fbFilter === k ? ' primary' : ' ghost'}" data-fbf="${k}">${l} ${n(k)}</button>`).join(' ');
    const item = (f) => `<div class="fb"><small>${when(f.at)} · ${esc(f.topic)}${f.tab ? ' › ' + esc(f.tab) : ''}${f.contact ? ' · ' + esc(f.contact) : ''}</small><p>${esc(f.text)}</p>
      <div class="fb-act">${f.status !== 'fixed' ? `<button class="btn small" data-fb="${esc(f.id)}" data-st="fixed">Mark fixed</button>` : ''}${f.status !== 'ignored' ? `<button class="btn small ghost" data-fb="${esc(f.id)}" data-st="ignored">Ignore</button>` : ''}${f.status !== 'open' ? `<button class="btn small ghost" data-fb="${esc(f.id)}" data-st="open">Reopen</button>` : ''}</div></div>`;
    return `<p style="margin:4px 0 14px">${tabs}</p>${list.length ? list.map(item).join('') : `<p class="muted">Nothing ${fbFilter === 'open' ? 'open. All caught up' : 'here'}.</p>`}`;
  }

  const accessLabel = (s, x) => (x.paid ? `Paid ₹${x.paid.amount}` : x.free ? `Free · ${modsLabel(s, x.free.modules)}` : 'Module 2 only');
  function studentsHTML(s, q) {
    const list = (s.students || []).filter((x) => !q || x.email.includes(q.toLowerCase()));
    if (!list.length) return `<p class="muted">${q ? 'No student matches that.' : 'Nobody has signed in yet.'}</p>`;
    const rows = list.slice(0, 300).map((x) => `<tr><td><button class="linkish" data-look-email="${esc(x.email)}">${esc(x.email)}</button></td><td>${esc(accessLabel(s, x))}</td><td>${x.first ? when(x.first) : x.early ? '<span class="muted">before tracking started</span>' : '<span class="muted">not yet</span>'}</td><td>${x.lastSeen ? when(x.lastSeen) : '—'}</td><td>${x.logins}</td><td style="white-space:nowrap">${x.phones} phone${x.phones === 1 ? '' : 's'} · ${x.pcs} PC${x.pcs === 1 ? '' : 's'}</td></tr>`);
    return tbl(['Student email', 'Access', 'First sign-in (UTC)', 'Last used (UTC)', 'Sign-ins', 'Devices'], rows) + (list.length > 300 ? `<p class="muted">Showing 300 of ${list.length}. Search to narrow it down, or download the CSV for all.</p>` : '');
  }
  function studentsCSV(s) {
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const head = ['email', 'access', 'paid_amount', 'payment_id', 'paid_at', 'free_modules', 'first_sign_in', 'last_seen', 'sign_ins', 'phones', 'pcs'];
    const lines = (s.students || []).map((x) => [x.email, accessLabel(s, x), x.paid ? x.paid.amount : '', x.paid ? x.paid.id : '', x.paid ? x.paid.at : '', x.free ? (x.free.modules || ['all']).join(' ') : '', x.first, x.lastSeen, x.logins, x.phones, x.pcs].map(q).join(','));
    const blob = new Blob([[head.join(','), ...lines].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bachy105-students-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function lookupHTML(s, r) {
    const d = r.devices, l = r.limits;
    return `<div class="look">
      <div class="look-row"><span>Payments</span><div>${r.payments.length ? r.payments.map((p) => `₹${p.amount} on ${when(p.at)} <code>${esc(p.id)}</code>`).join('<br>') : '<span class="muted">No payment from this student</span>'}</div></div>
      <div class="look-row"><span>Free access</span><div>${r.free ? `Yes${r.free.name ? ', ' + esc(r.free.name) : ''} · ${esc(modsLabel(s, r.free.modules))} · since ${when(r.free.at)}` : '<span class="muted">No</span>'}</div></div>
      <div class="look-row"><span>Devices in use</span><div>${d.phones} of ${l.phones} phone${l.phones === 1 ? '' : 's'} · ${d.pcs} of ${l.pcs} laptop${l.pcs === 1 ? '' : 's'}/PC${l.pcs === 1 ? '' : 's'} ${l.custom ? '<span class="pill-tag">custom limit</span>' : '<span class="muted">(default)</span>'}</div></div>
      <div class="look-act">
        ${r.free ? `<button class="btn small ghost" data-look="revoke">Remove free access</button>` : `<button class="btn small" data-look="grant">Give free access…</button>`}
        <button class="btn small ghost" data-look="limits">Change device limits…</button>
        <button class="btn small ghost" data-look="reset">Reset devices</button>
      </div></div>`;
  }

  function render(s) {
    const v30 = days(s.visits, 30), p30 = days(s.payments.byDay, 30);
    const visitors = v30.reduce((a, x) => a + x[1], 0);
    const views = Object.entries(s.views || {}).sort((a, b) => b[1] - a[1]).slice(0, 15);
    const F = s.funnel || { visitors: 0, paywall: 0, start: 0, paid: 0 };
    const Q = s.quiz || { top: [], answered: 0, questions: 0 };
    const B = s.banner || {};
    const modChecks = (s.paidModules || []).map((m) => `<label class="lim"><input type="checkbox" class="gmod" value="${esc(m.id)}" checked> Module ${+m.num}</label>`).join('');
    $('#out').innerHTML = `
      <div class="note"><div class="note-label">Your own access</div><p>Unlock every module on this device, free, with no device limit. Do it once on each phone or PC you use.</p><p style="margin-top:10px"><button class="btn primary" id="me">Unlock the full site on this device</button> <span class="msg" id="mm" style="display:inline-block;margin-left:10px"></span></p></div>
      ${s.storage ? '' : `<div class="note heads-up"><div class="note-label">Storage not set up yet</div><p>Payments below come straight from Razorpay. Everything else starts working once you add Upstash Redis in Vercel → Storage (free).</p></div>`}

      <section class="sum-sec" style="margin-top:28px"><h2 class="h-sec">Look up a student</h2>
        <form class="row" id="kf"><input id="kp" type="email" inputmode="email" autocomplete="off" placeholder="name.2026@vitstudent.ac.in" style="min-width:280px" required><button class="btn primary">Look up</button></form><p class="msg" id="km"></p>
        <div id="kout"></div>
      </section>

      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Students <small>${(s.students || []).length} students · ${(s.students || []).filter((x) => x.logins || x.lastSeen || x.early).length} signed in · ${(s.students || []).filter((x) => x.paid).length} paid · ${(s.students || []).filter((x) => x.free).length} free access</small></h2>
        <p class="row srow" style="margin:0 0 12px"><input id="sq" type="search" placeholder="Search by email" style="min-width:260px"><button class="btn" id="scsv">Download CSV</button></p>
        <div id="slist">${studentsHTML(s, '')}</div>
      </section>` : ''}

      <div class="kpis">
        <div><div class="v">${s.payments.count}</div><div class="l">paid users</div></div>
        <div><div class="v">₹${s.payments.revenue.toLocaleString('en-IN')}</div><div class="l">collected</div></div>
        <div><div class="v">₹${s.payments.fees.toLocaleString('en-IN')}</div><div class="l">Razorpay fees</div></div>
        <div><div class="v">${s.storage ? visitors : '—'}</div><div class="l">visitors, last 30 days</div></div>
      </div>

      ${s.storage ? `<section class="sum-sec" style="margin-top:36px"><h2 class="h-sec">Conversion <small>last 30 days</small></h2>
        <div class="funnel">
          <div><b>${F.visitors}</b><span>visited the site</span></div>
          <div><b>${F.paywall}</b><span>saw the payment page</span><em>${pct(F.paywall, F.visitors)} of visitors</em></div>
          <div><b>${F.start}</b><span>tapped Pay</span><em>${pct(F.start, F.paywall)} of those</em></div>
          <div><b>${F.paid}</b><span>paid</span><em>${pct(F.paid, F.start)} of those</em></div>
        </div>
        <p class="muted" style="font-size:13.5px">Counts started when this was added, so older days show 0. Each browser counts once per visit.</p></section>` : ''}

      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Settings</h2>
        <form class="row" id="pf"><label class="lim">Price ₹ <input id="pr" type="number" min="1" max="5000" value="${esc(s.price)}" required style="width:90px"></label><button class="btn">Save price</button></form>
        <p class="muted" style="font-size:13.5px;margin-top:6px">For new payments only. Everyone who already paid keeps access. The site shows the new price straight away.</p><p class="msg" id="pm"></p>
        <form id="bf" style="margin-top:18px"><label class="muted" for="bt" style="font-size:13.5px">Announcement at the top of the site</label>
          <textarea id="bt" maxlength="240" placeholder="e.g. CAT-2 revision notes for Module 4 are up!" class="ann">${esc(B.text || '')}</textarea>
          <p class="row" style="margin-top:8px"><button class="btn primary" data-ban="1">${B.on ? 'Update announcement' : 'Show announcement'}</button>${B.on ? '<button class="btn ghost" data-ban="0">Hide it</button>' : ''} <span class="muted" style="font-size:13.5px;align-self:center">${B.on ? 'Showing now' : 'Not showing'}</span></p>
          <p class="msg" id="bm"></p></form>
      </section>` : ''}

      <section class="sum-sec"><h2 class="h-sec">Payments per day <small>last 30 days</small></h2>${bars(p30)}</section>
      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Visitors per day <small>last 30 days</small></h2>${bars(v30)}</section>` : ''}

      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Quiz insights <small>${Q.answered} answers · ${Q.questions} questions</small></h2>
        <p class="muted">The questions people get wrong most often (at least 3 answers). A high miss rate usually means the topic needs a clearer explanation.</p>
        ${Q.top.length ? tbl(['Question', 'Wrong', 'Answers'], Q.top.map((q) => `<tr><td>${esc(q.label)}<br><small class="muted"><code>${esc(q.id)}</code></small></td><td><b>${pct(q.wrong, q.total)}</b></td><td>${q.total}</td></tr>`)) : '<p class="muted">Not enough answers yet.</p>'}</section>` : ''}

      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Marked "Confusing?"</h2>
        <p class="muted">Topic tabs students flagged as confusing, most first. Good candidates to rewrite.</p>
        ${(s.confusing || []).length ? tbl(['Topic › tab', 'Students'], s.confusing.map((c) => `<tr><td>${esc(c.label)}</td><td><b>${c.count}</b></td></tr>`)) : '<p class="muted">No flags yet.</p>'}</section>` : ''}

      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Most opened topics</h2>${views.length ? tbl(['Topic', 'Opens'], views.map(([t, n]) => `<tr><td>${esc(t)}</td><td>${n}</td></tr>`)) : '<p class="muted">No data yet.</p>'}</section>` : ''}

      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Mistake reports</h2><div id="fbl">${feedbackHTML(s)}</div></section>` : ''}

      <section class="sum-sec"><h2 class="h-sec">Recent payments</h2>${s.payments.recent.length ? tbl(['When (UTC)', 'Student', 'Amount', 'Payment ID'], s.payments.recent.map((p) => `<tr><td>${when(p.at)}</td><td>${esc(p.email)}</td><td>₹${esc(p.amount)}</td><td><code>${esc(p.id)}</code></td></tr>`)) : '<p class="muted">No payments yet.</p>'}</section>

      <section class="sum-sec"><h2 class="h-sec">Free access <small>${(s.free || []).length}</small></h2>
        <p class="muted">Add a VIT student email and that student gets the ticked modules free. Nothing for them to do: it unlocks as soon as they sign in with that account. Same device limit as payers (1 phone + 1 laptop/PC unless you change it below). Remove them and access stops right away.</p>
        <form class="row" id="gf"><input id="gp" type="email" inputmode="email" autocomplete="off" placeholder="name.2026@vitstudent.ac.in" style="min-width:280px" required><input id="gn" placeholder="Name (optional)" style="min-width:160px">${modChecks}<button class="btn primary">Give free access</button></form><p class="msg" id="gm"></p>
        ${(s.free || []).length ? tbl(['Student email', 'Name', 'Access', 'Added (UTC)', ''], s.free.map((f) => `<tr><td><code>${esc(f.email)}</code></td><td>${esc(f.name)}</td><td>${esc(modsLabel(s, f.modules))}</td><td>${when(f.at)}</td><td><button class="btn ghost" data-revoke="${esc(f.email)}">Remove</button></td></tr>`)) : '<p class="muted">Nobody yet.</p>'}
      </section>

      <section class="sum-sec"><h2 class="h-sec">Device limits <small>${(s.limits || []).length} custom</small></h2>
        <p class="muted">Everyone gets <b>1 phone + 1 laptop/PC</b> by default. Set a different number for a specific student here. It works for payers and free-access people alike. 0 means that kind of device is blocked.</p>
        <form class="row" id="lf"><input id="lp" type="email" inputmode="email" autocomplete="off" placeholder="name.2026@vitstudent.ac.in" style="min-width:280px" required>
          <label class="lim">Phones <input id="lph" type="number" min="0" max="20" value="2" required></label>
          <label class="lim">Laptops/PCs <input id="lpc" type="number" min="0" max="20" value="3" required></label>
          <button class="btn primary">Save limit</button></form><p class="msg" id="lmm"></p>
        ${(s.limits || []).length ? tbl(['Student email', 'Phones', 'Laptops/PCs', ''], s.limits.map((l) => `<tr><td><code>${esc(l.email)}</code></td><td>${esc(l.phones)}</td><td>${esc(l.pcs)}</td><td><button class="btn ghost" data-edit-lim="${esc(l.email)}" data-ph="${esc(l.phones)}" data-pc="${esc(l.pcs)}">Edit</button> <button class="btn ghost" data-clear-lim="${esc(l.email)}">Back to 1 + 1</button></td></tr>`)) : '<p class="muted">No custom limits yet.</p>'}
      </section>

      <section class="sum-sec"><h2 class="h-sec">Reset a student's devices</h2>
        <p class="muted">If someone gets a new phone or PC, clear their devices here so they can unlock the new one. Works for payers and free-access students alike.</p>
        <form class="row" id="rf"><input id="rp" type="email" inputmode="email" autocomplete="off" placeholder="name.2026@vitstudent.ac.in" style="min-width:280px" required><button class="btn">Reset devices</button></form><p class="msg" id="rm"></p>
      </section>`;

    const post = (data) => call('POST', data);
    $('#me').addEventListener('click', async () => {
      $('#mm').textContent = 'Unlocking…';
      try { await post({ action: 'unlock-me' }); $('#mm').innerHTML = 'Done. <a href="./" style="color:inherit">Open the site →</a>'; }
      catch (err) { $('#mm').textContent = err.message; }
    });

    // look up a student
    let looked = '';
    const lookup = async (email) => {
      $('#km').textContent = 'Looking up…'; $('#kout').innerHTML = '';
      try {
        const r = await post({ action: 'lookup', email }); looked = r.email;
        $('#km').textContent = ''; $('#kout').innerHTML = lookupHTML(s, r);
        $$('[data-look]', $('#kout')).forEach((b) => b.addEventListener('click', async () => {
          const k = b.dataset.look;
          if (k === 'grant') { $('#gp').value = looked; $('#gf').scrollIntoView({ block: 'center' }); $('#gn').focus(); return; }
          if (k === 'limits') { $('#lp').value = looked; $('#lph').value = r.limits.phones; $('#lpc').value = r.limits.pcs; $('#lf').scrollIntoView({ block: 'center' }); $('#lph').focus(); return; }
          if (k === 'revoke' && !confirm('Remove free access for ' + looked + '?')) return;
          if (k === 'reset' && !confirm('Clear all devices for ' + looked + '? They will need to unlock again.')) return;
          b.disabled = true;
          try { await post({ action: k === 'reset' ? 'reset-devices' : 'revoke', email: looked }); lookup(looked); }
          catch (err) { b.disabled = false; $('#km').textContent = err.message; }
        }));
      } catch (err) { $('#km').textContent = err.message; }
    };
    $('#kf').addEventListener('submit', (e) => { e.preventDefault(); lookup($('#kp').value); });

    // students list: search, CSV, click an email to look it up
    const wireStudents = () => $$('[data-look-email]').forEach((b) => b.addEventListener('click', () => { $('#kp').value = b.dataset.lookEmail; $('#kf').scrollIntoView({ block: 'center' }); lookup(b.dataset.lookEmail); }));
    if ($('#slist')) {
      wireStudents();
      $('#sq').addEventListener('input', () => { $('#slist').innerHTML = studentsHTML(s, $('#sq').value.trim()); wireStudents(); });
      $('#scsv').addEventListener('click', () => studentsCSV(s));
    }

    // settings
    if ($('#pf')) $('#pf').addEventListener('submit', async (e) => {
      e.preventDefault(); $('#pm').textContent = 'Saving…';
      try { await post({ action: 'set-price', rupees: +$('#pr').value }); $('#pm').textContent = 'Saved. New payments are now ₹' + (+$('#pr').value) + '.'; }
      catch (err) { $('#pm').textContent = err.message; }
    });
    $$('[data-ban]').forEach((b) => b.addEventListener('click', async (e) => {
      e.preventDefault(); $('#bm').textContent = 'Saving…';
      try { await post({ action: 'set-banner', text: $('#bt').value, on: b.dataset.ban === '1' }); $('#bm').textContent = b.dataset.ban === '1' ? 'Showing on the site now.' : 'Hidden.'; setTimeout(load, 1200); }
      catch (err) { $('#bm').textContent = err.message; }
    }));

    // mistake reports
    const wireFeedback = () => {
      $$('[data-fbf]').forEach((b) => b.addEventListener('click', () => { fbFilter = b.dataset.fbf; $('#fbl').innerHTML = feedbackHTML(s); wireFeedback(); }));
      $$('[data-fb]').forEach((b) => b.addEventListener('click', async () => {
        b.disabled = true;
        try { await post({ action: 'feedback-status', id: b.dataset.fb, status: b.dataset.st }); const f = s.feedback.find((x) => x.id === b.dataset.fb); if (f) f.status = b.dataset.st; $('#fbl').innerHTML = feedbackHTML(s); wireFeedback(); }
        catch (err) { b.disabled = false; alert(err.message); }
      }));
    };
    if ($('#fbl')) wireFeedback();

    // free access
    $('#gf').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mods = $$('.gmod').filter((c) => c.checked).map((c) => c.value);
      if (!mods.length) { $('#gm').textContent = 'Tick at least one module.'; return; }
      $('#gm').textContent = 'Saving…';
      try { await post({ action: 'grant', email: $('#gp').value, name: $('#gn').value, modules: mods }); $('#gm').textContent = 'Added. It unlocks as soon as they sign in with that account.'; setTimeout(load, 2500); }
      catch (err) { $('#gm').textContent = err.message; }
    });
    $$('[data-revoke]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Remove free access for ' + b.dataset.revoke + '?')) return;
      b.disabled = true;
      try { await post({ action: 'revoke', email: b.dataset.revoke }); load(); }
      catch (err) { b.disabled = false; alert(err.message); }
    }));

    // device limits
    $('#lf').addEventListener('submit', async (e) => {
      e.preventDefault(); $('#lmm').textContent = 'Saving…';
      try { await post({ action: 'set-limits', email: $('#lp').value, phones: $('#lph').value, pcs: $('#lpc').value }); $('#lmm').textContent = 'Saved. Refreshing the list…'; load(); }
      catch (err) { $('#lmm').textContent = err.message; }
    });
    $$('[data-edit-lim]').forEach((b) => b.addEventListener('click', () => {
      $('#lp').value = b.dataset.editLim; $('#lph').value = b.dataset.ph; $('#lpc').value = b.dataset.pc;
      $('#lf').scrollIntoView({ block: 'center' }); $('#lph').focus();
    }));
    $$('[data-clear-lim]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Set ' + b.dataset.clearLim + ' back to 1 phone + 1 laptop/PC?')) return;
      b.disabled = true;
      try { await post({ action: 'clear-limits', email: b.dataset.clearLim }); load(); }
      catch (err) { b.disabled = false; alert(err.message); }
    }));

    $('#rf').addEventListener('submit', async (e) => {
      e.preventDefault(); $('#rm').textContent = 'Resetting…';
      try { await post({ action: 'reset-devices', email: $('#rp').value }); $('#rm').textContent = 'Done. They can now sign in on new devices.'; }
      catch (err) { $('#rm').textContent = err.message; }
    });
  }
  async function load() {
    $('#lm').textContent = 'Loading…';
    try { const s = await call('GET'); $('#login').hidden = true; $('#out').hidden = false; render(s); }
    catch (e) { $('#lm').textContent = e.message; try { sessionStorage.removeItem('bn_admin'); } catch (x) {} }
  }
  $('#f').addEventListener('submit', (e) => { e.preventDefault(); key = $('#k').value; try { sessionStorage.setItem('bn_admin', key); } catch (x) {} load(); });
  if (key) load();
})();
</script>
</body>
</html>
