<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner stats · BACHY105 Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  body { overflow-y: auto; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 36px 16px 80px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 22px 0 8px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpis > div { background: var(--bg-2); padding: 16px 18px; }
  .kpis .v { font-family: var(--serif); font-size: 32px; color: var(--white); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpis .l { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 10px 0 0; border-bottom: 1px solid var(--line-2); }
  .bars > div { flex: 1; background: var(--text-2); border-radius: 3px 3px 0 0; min-width: 4px; position: relative; }
  .bars > div:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font: 11px var(--mono); color: var(--white); background: var(--surface-2); padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
  .axis { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--text-faint); margin-top: 6px; }
  .fb { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); padding: 12px 16px; margin-bottom: 8px; }
  .fb small { font-family: var(--mono); color: var(--text-faint); }
  .fb p { margin: 6px 0 0; color: var(--text-2); white-space: pre-wrap; }
  .note { margin-top: 14px; }
  form.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  form.row input { height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--white); padding: 0 12px; font-family: var(--mono); min-width: 220px; }
  label.lim { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-dim); }
  form.row label.lim input { min-width: 0; width: 70px; }
  .msg { font-size: 14px; color: var(--warn); min-height: 1.4em; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="code">Owner</span><span>BACHY105 Notes</span><span class="dot">·</span><a href="./" style="color:inherit">Back to the site</a></div>
  <h1 class="h-display" style="font-size:40px">Stats</h1>
  <div id="login">
    <p class="muted">Enter your admin key (the <code>ADMIN_KEY</code> you set in Vercel). It stays in this tab only.</p>
    <form class="row" id="f"><input id="k" type="password" placeholder="Admin key" autocomplete="current-password" required><button class="btn primary">Show stats</button></form>
    <p class="msg" id="lm"></p>
  </div>
  <div id="out" hidden></div>
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let key = ''; try { key = sessionStorage.getItem('bn_admin') || ''; } catch (e) {}
  async function call(method, data) {
    const r = await fetch('/api/stats', { method, headers: { 'x-admin-key': key, 'Content-Type': 'application/json' }, body: data ? JSON.stringify(data) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
    return j;
  }
  function days(obj, n) {
    const out = []; const d = new Date();
    for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setUTCDate(d.getUTCDate() - i); const k = x.toISOString().slice(0, 10); out.push([k, (obj && obj[k]) || 0]); }
    return out;
  }
  function bars(series) {
    const max = Math.max(1, ...series.map((s) => s[1]));
    return `<div class="bars">${series.map(([k, v]) => `<div style="height:${Math.max(2, (v / max) * 100)}%" data-tip="${k}: ${v}"></div>`).join('')}</div><div class="axis"><span>${series[0][0]}</span><span>${series[series.length - 1][0]}</span></div>`;
  }
  function render(s) {
    const v30 = days(s.visits, 30), p30 = days(s.payments.byDay, 30);
    const visitors = v30.reduce((a, x) => a + x[1], 0);
    const views = Object.entries(s.views || {}).sort((a, b) => b[1] - a[1]).slice(0, 15);
    $('#out').innerHTML = `
      <div class="note"><div class="note-label">Your own access</div><p>Unlock every module on this device, free, with no device limit. Do it once on each phone or PC you use.</p><p style="margin-top:10px"><button class="btn primary" id="me">Unlock the full site on this device</button> <span class="msg" id="mm" style="display:inline-block;margin-left:10px"></span></p></div>
      ${s.storage ? '' : `<div class="note heads-up"><div class="note-label">Storage not set up yet</div><p>Payments below come straight from Razorpay. <b>Visitors, topic views, feedback and the 2-device limit</b> start working once you add Upstash Redis in Vercel → Storage (free).</p></div>`}
      <div class="kpis">
        <div><div class="v">${s.payments.count}</div><div class="l">paid users</div></div>
        <div><div class="v">₹${s.payments.revenue.toLocaleString('en-IN')}</div><div class="l">collected</div></div>
        <div><div class="v">₹${s.payments.fees.toLocaleString('en-IN')}</div><div class="l">Razorpay fees</div></div>
        <div><div class="v">${s.storage ? visitors : '—'}</div><div class="l">visitors, last 30 days</div></div>
      </div>
      <section class="sum-sec" style="margin-top:36px"><h2 class="h-sec">Payments per day <small>last 30 days</small></h2>${bars(p30)}</section>
      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Visitors per day <small>last 30 days</small></h2>${bars(v30)}</section>` : ''}
      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Most opened topics</h2>${views.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Topic</th><th>Opens</th></tr></thead><tbody>${views.map(([t, n]) => `<tr><td>${esc(t)}</td><td>${n}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No data yet.</p>'}</section>` : ''}
      ${s.storage ? `<section class="sum-sec"><h2 class="h-sec">Mistake reports <small>${(s.feedback || []).length}</small></h2>${(s.feedback || []).length ? s.feedback.map((f) => `<div class="fb"><small>${esc((f.at || '').replace('T', ' ').slice(0, 16))} · ${esc(f.topic)}${f.tab ? ' › ' + esc(f.tab) : ''}${f.contact ? ' · ' + esc(f.contact) : ''}</small><p>${esc(f.text)}</p></div>`).join('') : '<p class="muted">No reports yet.</p>'}</section>` : ''}
      <section class="sum-sec"><h2 class="h-sec">Recent payments</h2>${s.payments.recent.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When (UTC)</th><th>Phone</th><th>Payment ID</th></tr></thead><tbody>${s.payments.recent.map((p) => `<tr><td>${esc(p.at.replace('T', ' ').slice(0, 16))}</td><td>${esc(p.phone)}</td><td><code>${esc(p.id)}</code></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No payments yet.</p>'}</section>
      <section class="sum-sec"><h2 class="h-sec">Free access <small>${(s.free || []).length}</small></h2>
        <p class="muted">Add a phone number and that person gets everything free. They open the site, tap <b>Already paid, or given free access? Unlock here</b> and enter this number. Same device limit as payers (1 phone + 1 laptop/PC unless you change it below). Remove them and access stops right away.</p>
        <form class="row" id="gf"><input id="gp" inputmode="numeric" placeholder="10-digit phone" required><input id="gn" placeholder="Name (optional)" style="min-width:160px"><button class="btn primary">Give free access</button></form><p class="msg" id="gm"></p>
        ${(s.free || []).length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Phone</th><th>Name</th><th>Added (UTC)</th><th></th></tr></thead><tbody>${s.free.map((f) => `<tr><td><code>${esc(f.phone)}</code></td><td>${esc(f.name)}</td><td>${esc((f.at || '').replace('T', ' ').slice(0, 16))}</td><td><button class="btn ghost" data-revoke="${esc(f.phone)}">Remove</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Nobody yet.</p>'}
      </section>
      <section class="sum-sec"><h2 class="h-sec">Device limits <small>${(s.limits || []).length} custom</small></h2>
        <p class="muted">Everyone gets <b>1 phone + 1 laptop/PC</b> by default. Set a different number for a specific phone number here. It works for payers and free-access people alike. 0 means that kind of device is blocked.</p>
        <form class="row" id="lf"><input id="lp" inputmode="numeric" placeholder="10-digit phone" required>
          <label class="lim">Phones <input id="lph" type="number" min="0" max="20" value="2" required></label>
          <label class="lim">Laptops/PCs <input id="lpc" type="number" min="0" max="20" value="3" required></label>
          <button class="btn primary">Save limit</button></form><p class="msg" id="lmm"></p>
        ${(s.limits || []).length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Phone</th><th>Phones</th><th>Laptops/PCs</th><th></th></tr></thead><tbody>${s.limits.map((l) => `<tr><td><code>${esc(l.number)}</code></td><td>${esc(l.phones)}</td><td>${esc(l.pcs)}</td><td><button class="btn ghost" data-edit-lim="${esc(l.number)}" data-ph="${esc(l.phones)}" data-pc="${esc(l.pcs)}">Edit</button> <button class="btn ghost" data-clear-lim="${esc(l.number)}">Back to 1 + 1</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No custom limits yet.</p>'}
      </section>
      <section class="sum-sec"><h2 class="h-sec">Reset a student's devices</h2>
        <p class="muted">If someone gets a new phone or PC, clear their devices here so they can unlock the new one. Works for payers and free-access numbers.</p>
        <form class="row" id="rf"><input id="rp" inputmode="numeric" placeholder="Student's 10-digit phone" required><button class="btn">Reset devices</button></form><p class="msg" id="rm"></p>
      </section>`;
    $('#me').addEventListener('click', async () => {
      $('#mm').textContent = 'Unlocking…';
      try { await call('POST', { action: 'unlock-me' }); $('#mm').innerHTML = 'Done. <a href="./" style="color:inherit">Open the site →</a>'; }
      catch (err) { $('#mm').textContent = err.message; }
    });
    $('#gf').addEventListener('submit', async (e) => {
      e.preventDefault(); $('#gm').textContent = 'Saving…';
      try { await call('POST', { action: 'grant', phone: $('#gp').value, name: $('#gn').value }); $('#gm').textContent = 'Added. Next step: on the device to unlock, open the site, tap "Unlock here" and enter this number.'; setTimeout(load, 2500); }
      catch (err) { $('#gm').textContent = err.message; }
    });
    document.querySelectorAll('[data-revoke]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Remove free access for ' + b.dataset.revoke + '?')) return;
      b.disabled = true;
      try { await call('POST', { action: 'revoke', phone: b.dataset.revoke }); load(); }
      catch (err) { b.disabled = false; alert(err.message); }
    }));
    $('#lf').addEventListener('submit', async (e) => {
      e.preventDefault(); $('#lmm').textContent = 'Saving…';
      try { await call('POST', { action: 'set-limits', phone: $('#lp').value, phones: $('#lph').value, pcs: $('#lpc').value }); $('#lmm').textContent = 'Saved. Refreshing the list…'; load(); }
      catch (err) { $('#lmm').textContent = err.message; }
    });
    document.querySelectorAll('[data-edit-lim]').forEach((b) => b.addEventListener('click', () => {
      $('#lp').value = b.dataset.editLim; $('#lph').value = b.dataset.ph; $('#lpc').value = b.dataset.pc;
      $('#lf').scrollIntoView({ block: 'center' }); $('#lph').focus();
    }));
    document.querySelectorAll('[data-clear-lim]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Set ' + b.dataset.clearLim + ' back to 1 phone + 1 laptop/PC?')) return;
      b.disabled = true;
      try { await call('POST', { action: 'clear-limits', phone: b.dataset.clearLim }); load(); }
      catch (err) { b.disabled = false; alert(err.message); }
    }));
    $('#rf').addEventListener('submit', async (e) => {
      e.preventDefault(); $('#rm').textContent = 'Resetting…';
      try { const r = await call('POST', { action: 'reset-devices', phone: $('#rp').value }); $('#rm').textContent = `Done. ${r.reset} payment(s) reset; they can now unlock on new devices.`; }
      catch (err) { $('#rm').textContent = err.message; }
    });
  }
  async function load() {
    $('#lm').textContent = 'Loading…';
    try { const s = await call('GET'); $('#login').hidden = true; $('#out').hidden = false; render(s); }
    catch (e) { $('#lm').textContent = e.message; try { sessionStorage.removeItem('bn_admin'); } catch (x) {} }
  }
  $('#f').addEventListener('submit', (e) => { e.preventDefault(); key = $('#k').value; try { sessionStorage.setItem('bn_admin', key); } catch (x) {} load(); });
  if (key) load();
})();
</script>
</body>
</html>
