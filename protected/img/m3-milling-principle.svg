<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Ball milling: the principle</text><circle cx="200" cy="130" r="60" class="dfw" fill-opacity=".4"/><circle cx="380" cy="130" r="60" class="dfw" fill-opacity=".4"/><path d="M100 130H138" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><path d="M480 130H442" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><circle cx="285" cy="105" r="7" class="dfo" /><circle cx="292" cy="130" r="7" class="dfo" /><circle cx="286" cy="155" r="7" class="dfo" /><text x="290" y="220" font-size="22" class="dt" text-anchor="middle">powder (≈ 50 µm) squeezed between two balls</text><text x="290" y="252" font-size="22" class="dt2" text-anchor="middle">preferably under inert atmosphere</text><rect x="100" y="300" width="400" height="120" class="df3 ds" rx="14" stroke-dasharray="8 6" fill-opacity=".4" stroke-width="3"/><circle cx="170" cy="370" r="20" class="dfw" fill-opacity=".7"/><circle cx="250" cy="340" r="20" class="dfw" fill-opacity=".7"/><circle cx="330" cy="375" r="20" class="dfw" fill-opacity=".7"/><circle cx="420" cy="350" r="20" class="dfw" fill-opacity=".7"/><text x="300" y="460" font-size="22" class="dt" text-anchor="middle">vial with WC-coated balls and powder</text><text x="14" y="520" font-size="22" class="dt2">A shaker mill swings the vial so the balls</text><text x="14" y="550" font-size="22" class="dt2">collide with the powder again and again.</text>
</svg>
