<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Three ways heat moves</text><rect x="150" y="120" width="220" height="110" class="dfb dsb" rx="8" fill-opacity=".3" stroke-width="3"/><rect x="370" y="140" width="150" height="22" class="df3 ds" stroke-width="3"/><path d="M190 330Q210 280 230 330Q250 270 270 330Q290 280 310 330Q330 270 350 330z" class="dfo dso" fill-opacity=".6" stroke-width="3"/><path d="M395 151H495" class="dsr" fill="none" stroke-width="4" marker-end="url(#r)"/><text x="445" y="128" font-size="22" font-weight="700" class="dtr" text-anchor="middle">conduction</text><path d="M200 160Q260 200 320 160" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><text x="260" y="215" font-size="22" font-weight="700" class="dtb" text-anchor="middle">convection</text><path d="M170 300L110 270" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><path d="M370 300L430 270" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><text x="300" y="372" font-size="22" font-weight="700" class="dto" text-anchor="middle">radiation</text><text x="14" y="420" font-size="22" class="dt2">Conduction warms the handle; convection</text><text x="14" y="450" font-size="22" class="dt2">currents circulate the water; radiation</text><text x="14" y="480" font-size="22" class="dt2">spreads heat out from the flame.</text>
