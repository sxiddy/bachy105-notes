<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Resistivity of metals</text><text x="14" y="106" font-size="24" font-weight="700" class="dt">Silver</text><rect x="170" y="70" width="205.4" height="52" class="dfg dsg" rx="6" fill-opacity=".35" stroke-width="3"/><text x="387.4" y="106" font-size="24" font-weight="700" class="dt">1.58</text><text x="14" y="186" font-size="24" font-weight="700" class="dt">Copper</text><rect x="170" y="150" width="218.4" height="52" class="dfo dso" rx="6" fill-opacity=".35" stroke-width="3"/><text x="400.4" y="186" font-size="24" font-weight="700" class="dt">1.68</text><text x="14" y="266" font-size="24" font-weight="700" class="dt">Gold</text><rect x="170" y="230" width="287.3" height="52" class="dfy dsy" rx="6" fill-opacity=".35" stroke-width="3"/><text x="469.3" y="266" font-size="24" font-weight="700" class="dt">2.21</text><text x="14" y="346" font-size="24" font-weight="700" class="dt">Aluminium</text><rect x="170" y="310" width="344.5" height="52" class="dfb dsb" rx="6" fill-opacity=".35" stroke-width="3"/><text x="526.5" y="346" font-size="24" font-weight="700" class="dt">2.65</text><text x="14" y="420" font-size="22" class="dt2">µΩ·cm: lower resistivity, better conductor.</text><text x="14" y="450" font-size="22" class="dt2">Copper is the standard; aluminium is lighter.</text>
