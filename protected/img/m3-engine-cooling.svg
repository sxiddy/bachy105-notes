<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Car engine cooling</text><rect x="20" y="60" width="230" height="120" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="135" y="98" font-size="22" class="dt" text-anchor="middle">engine block</text><text x="135" y="128" font-size="22" class="dt" text-anchor="middle">water jacket round</text><text x="135" y="158" font-size="22" class="dt" text-anchor="middle">the cylinders</text><rect x="350" y="60" width="230" height="120" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="465" y="128" font-size="24" class="dt" text-anchor="middle">radiator</text><rect x="430" y="220" width="150" height="60" class="df3 ds" rx="10" fill-opacity=".3" stroke-width="3"/><text x="505" y="258" font-size="24" class="dt" text-anchor="middle">fan</text><path d="M250 90H350" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><text x="300" y="82" font-size="22" class="dtr" text-anchor="middle">hot</text><path d="M350 150H250" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><text x="300" y="188" font-size="22" class="dtb" text-anchor="middle">cooled</text><path d="M505 220V184" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="300" y="330" font-size="22" class="dt2"></text><text x="14" y="330" font-size="22" class="dt2">Pump: pushes water through the jacket.</text><text x="14" y="360" font-size="22" class="dt2">Thermostat: controls the flow to the radiator.</text><text x="14" y="390" font-size="22" class="dt2">Fan: pulls air through to cool it.</text><text x="14" y="420" font-size="22" class="dt2">The radiator also has a pressure cap,</text><text x="14" y="450" font-size="22" class="dt2">drain cock and overflow pipe.</text>
</svg>
