<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Layers of a PV cell</text><path d="M120 60q10-14 20 0t20 0M270 60q10-14 20 0t20 0M420 60q10-14 20 0t20 0" class="dsy" fill="none" stroke-width="3"/><text x="300" y="98" font-size="22" class="dty" text-anchor="middle">energy from light</text><rect x="40" y="120" width="520" height="50" class="dfb dsb" fill-opacity=".4" stroke-width="2"/><text x="300" y="153" font-size="24" class="dtb" text-anchor="middle">glass</text><rect x="40" y="170" width="520" height="40" class="dfb dsb" fill-opacity=".4" stroke-width="2"/><text x="300" y="198" font-size="24" class="dtb" text-anchor="middle">transparent negative terminal (−)</text><rect x="40" y="210" width="520" height="60" class="dfb dsb" fill-opacity=".4" stroke-width="2"/><text x="300" y="248" font-size="24" class="dtb" text-anchor="middle">n-type layer (semiconductor)</text><path d="M40 270H560" class="dsy" fill="none" stroke-width="3" stroke-dasharray="8 6"/><text x="300" y="296" font-size="22" class="dty" text-anchor="middle">junction</text><rect x="40" y="310" width="520" height="60" class="dfo dso" fill-opacity=".4" stroke-width="2"/><text x="300" y="348" font-size="24" class="dto" text-anchor="middle">p-type layer (semiconductor)</text><rect x="40" y="370" width="520" height="40" class="dfr dsr" fill-opacity=".4" stroke-width="2"/><text x="300" y="398" font-size="24" class="dtr" text-anchor="middle">positive terminal (+)</text><path d="M0 450H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="484" font-size="26" font-weight="700" class="dt">1  Light frees electrons</text><rect x="30" y="510" width="200" height="40" class="dfb" fill-opacity=".4"/><rect x="30" y="550" width="200" height="40" class="dfo" fill-opacity=".4"/><path d="M30 550H230" class="dsy" fill="none" stroke-width="2" stroke-dasharray="6 5"/><path d="M70 508q8 10 16 0t16 0t16 0" class="dsy" fill="none" stroke-width="3" /><path d="M92 524V558" class="dsy" fill="none" stroke-width="3" marker-end="url(#y)"/><circle cx="92" cy="566" r="9" class="dfy ds" stroke-width="2"/><text x="260" y="530" font-size="22" class="dt2">light knocks electrons</text><text x="260" y="560" font-size="22" class="dt2">loose near the junction</text><path d="M0 620H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="654" font-size="26" font-weight="700" class="dt">2  Junction sorts them</text><rect x="30" y="680" width="200" height="40" class="dfb" fill-opacity=".4"/><rect x="30" y="720" width="200" height="40" class="dfo" fill-opacity=".4"/><path d="M30 720H230" class="dsy" fill="none" stroke-width="2" stroke-dasharray="6 5"/><circle cx="70" cy="690" r="9" class="dfy ds" stroke-width="2"/><path d="M70 685V650" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><circle cx="150" cy="760" r="9" class="dfy ds" stroke-width="2"/><path d="M150 755V735" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="260" y="700" font-size="22" class="dt2">electrons drift to the n side;</text><text x="260" y="730" font-size="22" class="dt2">holes are filled from below</text><path d="M0 790H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="824" font-size="26" font-weight="700" class="dt">3  Electrons flow out</text><rect x="30" y="850" width="200" height="40" class="dfb" fill-opacity=".4"/><rect x="30" y="890" width="200" height="40" class="dfo" fill-opacity=".4"/><path d="M30 890H230" class="dsy" fill="none" stroke-width="2" stroke-dasharray="6 5"/><path d="M70 850H230" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M70 920H170" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="260" y="870" font-size="22" class="dt2">out of the (−) terminal, through</text><text x="260" y="900" font-size="22" class="dt2">the bulb, back in at (+); they</text><text x="260" y="930" font-size="22" class="dt2">fill the holes. This is the current.</text><text x="300" y="985" font-size="22" class="dt3" text-anchor="middle">Source: U.S. Energy Information Administration</text>
</svg>
