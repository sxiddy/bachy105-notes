<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Arrhenius plot</text><path d="M80 60V420H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="454" font-size="22" font-weight="700" class="dt2" text-anchor="end">1/T</text><text x="92" y="76" font-size="22" font-weight="700" class="dt2">ln k</text><path d="M80 100L200 176M80 100L200 134" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><path d="M200 176L540 390" class="dsr" fill="none" stroke-width="5" /><path d="M200 134L540 230" class="dsb" fill="none" stroke-width="5" /><circle cx="80" cy="100" r="7" class="dfw" /><text x="66" y="108" font-size="22" font-weight="700" class="dt" text-anchor="end">ln A</text><path d="M24 493H70" class="dsr" fill="none" stroke-width="5" /><text x="82" y="500" font-size="22" class="dt">steep: high Eₐ, strong T effect</text><path d="M24 527H70" class="dsb" fill="none" stroke-width="5" /><text x="82" y="534" font-size="22" class="dt">shallow: low Eₐ, weak T effect</text><text x="14" y="580" font-size="24" font-weight="700" class="dt mono">ln k = ln A − Eₐ/RT</text><text x="14" y="612" font-size="22" class="dt2">Slope = −Eₐ/R, intercept = ln A</text>
