<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Smaller pieces, more surface</text><rect x="20" y="70" width="150" height="150" class="dfb dsb" fill-opacity=".3" stroke-width="3"/><text x="95" y="262" font-size="22" class="dt" text-anchor="middle">1 cube</text><text x="95" y="296" font-size="22" font-weight="700" class="dto" text-anchor="middle">area 6 cm²</text><rect x="210" y="70" width="150" height="150" class="dfb dsb" fill-opacity=".3" stroke-width="3"/><path d="M285 70V220M210 145H360" class="dsb" fill="none" stroke-width="2" /><text x="285" y="262" font-size="22" class="dt" text-anchor="middle">8 cubes</text><text x="285" y="296" font-size="22" font-weight="700" class="dto" text-anchor="middle">area 12 cm²</text><rect x="400" y="70" width="150" height="150" class="dfb dsb" fill-opacity=".3" stroke-width="3"/><path d="M450 70V220M400 120H550" class="dsb" fill="none" stroke-width="2" /><path d="M500 70V220M400 170H550" class="dsb" fill="none" stroke-width="2" /><text x="475" y="262" font-size="22" class="dt" text-anchor="middle">27 cubes</text><text x="475" y="296" font-size="22" font-weight="700" class="dto" text-anchor="middle">area 18 cm²</text><text x="14" y="370" font-size="22" class="dt2">Volume stays 1 cm³ but the area grows</text><text x="14" y="400" font-size="22" class="dt2">6 → 12 → 18 cm². More surface means</text><text x="14" y="430" font-size="22" class="dt2">better catalytic efficiency.</text>
</svg>
