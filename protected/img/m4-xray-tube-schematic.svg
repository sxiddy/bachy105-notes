<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">X-ray tube</text><rect x="30" y="60" width="540" height="160" class="dfw" rx="40" fill-opacity=".08" stroke-width="0"/><rect x="30" y="60" width="540" height="160" class="ds" fill="none" rx="40" stroke-width="3"/><path d="M110 140q15-14 30 0t30 0" class="dso" fill="none" stroke-width="5" /><text x="140" y="108" font-size="22" class="dto" text-anchor="middle">heated filament</text><text x="140" y="240" font-size="22" class="dt" text-anchor="middle">cathode (−)</text><path d="M190 100H420" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M190 130H420" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M190 160H420" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><path d="M440 80L500 120V220H440z" class="dfw dsw" fill-opacity=".4" stroke-width="3"/><text x="480" y="250" font-size="22" class="dt" text-anchor="middle">anode</text><text x="480" y="276" font-size="22" class="dt" text-anchor="middle">(water-cooled)</text><text x="300" y="190" font-size="22" class="dt3" text-anchor="middle">vacuum</text><path d="M455 160L420 215" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><path d="M470 170L480 225" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><text x="300" y="262" font-size="22" font-weight="700" class="dty" text-anchor="middle">X-rays</text><path d="M140 220V320H480V220" class="ds" fill="none" stroke-width="4" /><circle cx="310" cy="320" r="30" class="df2 ds" stroke-width="4"/><text x="310" y="328" font-size="22" font-weight="700" class="dt" text-anchor="middle">HV</text><text x="14" y="390" font-size="22" class="dt2">The high voltage pulls electrons from the</text><text x="14" y="420" font-size="22" class="dt2">hot cathode across the vacuum. X-rays leave</text><text x="14" y="450" font-size="22" class="dt2">where they hit the metal target.</text>
</svg>
