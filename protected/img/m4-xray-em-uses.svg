<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Where X-rays sit, and what they are used for</text><text x="300" y="76" font-size="22" class="dt3" text-anchor="middle">photon energy (top) · wavelength (bottom)</text><path d="M50 120H550" class="ds" fill="none" stroke-width="3" /><path d="M50 112V128" class="ds" fill="none" stroke-width="3" /><text x="50" y="104" font-size="22" class="dt mono" text-anchor="middle">1 eV</text><text x="50" y="156" font-size="22" class="dt2 mono" text-anchor="middle">1.2 µm</text><path d="M121.42857142857143 112V128" class="ds" fill="none" stroke-width="3" /><path d="M192.85714285714286 112V128" class="ds" fill="none" stroke-width="3" /><text x="192.85714285714286" y="104" font-size="22" class="dt mono" text-anchor="middle">100 eV</text><text x="192.85714285714286" y="156" font-size="22" class="dt2 mono" text-anchor="middle">12 nm</text><path d="M264.2857142857143 112V128" class="ds" fill="none" stroke-width="3" /><path d="M335.7142857142857 112V128" class="ds" fill="none" stroke-width="3" /><text x="335.7142857142857" y="104" font-size="22" class="dt mono" text-anchor="middle">10 keV</text><text x="335.7142857142857" y="156" font-size="22" class="dt2 mono" text-anchor="middle">120 pm</text><path d="M407.14285714285717 112V128" class="ds" fill="none" stroke-width="3" /><path d="M478.57142857142856 112V128" class="ds" fill="none" stroke-width="3" /><text x="478.57142857142856" y="104" font-size="22" class="dt mono" text-anchor="middle">1 MeV</text><text x="478.57142857142856" y="156" font-size="22" class="dt2 mono" text-anchor="middle">1.2 pm</text><path d="M550 112V128" class="ds" fill="none" stroke-width="3" /><rect x="64.57999876113749" y="190" width="22.456711230140186" height="40" class="dfy dsy" rx="6" fill-opacity=".35" stroke-width="2"/><text x="17.036709991277675" y="218" font-size="22" font-weight="700" class="dt" text-anchor="middle"></text><text x="95.03670999127768" y="218" font-size="22" font-weight="700" class="dty">visible</text><rect x="87.03670999127768" y="242" width="134.24471919958216" height="40" class="dfp dsp" rx="6" fill-opacity=".35" stroke-width="2"/><text x="151.28142919085982" y="270" font-size="22" font-weight="700" class="dt" text-anchor="middle">ultraviolet</text><rect x="198.5129461462589" y="294" width="137.2013395680268" height="40" class="dfb dsb" rx="6" fill-opacity=".35" stroke-width="2"/><text x="265.7142857142857" y="322" font-size="22" font-weight="700" class="dt" text-anchor="middle">soft X-rays</text><rect x="319.86794645597456" y="346" width="115.69919702059957" height="40" class="dfo dso" rx="6" fill-opacity=".35" stroke-width="2"/><text x="365.56714347657413" y="374" font-size="22" font-weight="700" class="dt" text-anchor="middle">hard X-rays</text><rect x="407.14285714285717" y="398" width="142.85714285714283" height="40" class="dfr dsr" rx="6" fill-opacity=".35" stroke-width="2"/><text x="478.57142857142856" y="426" font-size="22" font-weight="700" class="dt" text-anchor="middle">gamma rays</text><path d="M328.792141927996 450V463" class="ds2" fill="none" stroke-width="2" /><circle cx="328.792141927996" cy="480" r="17" class="dfo dso" stroke-width="2"/><text x="328.792141927996" y="488" font-size="22" font-weight="700" class="dt" text-anchor="middle">1</text><path d="M357.21642826171296 450V505" class="ds2" fill="none" stroke-width="2" /><circle cx="357.21642826171296" cy="522" r="17" class="dfo dso" stroke-width="2"/><text x="357.21642826171296" y="530" font-size="22" font-weight="700" class="dt" text-anchor="middle">2</text><path d="M391.296517884546 450V463" class="ds2" fill="none" stroke-width="2" /><circle cx="391.296517884546" cy="480" r="17" class="dfo dso" stroke-width="2"/><text x="391.296517884546" y="488" font-size="22" font-weight="700" class="dt" text-anchor="middle">3</text><path d="M419.72080421826297 450V505" class="ds2" fill="none" stroke-width="2" /><circle cx="419.72080421826297" cy="522" r="17" class="dfo dso" stroke-width="2"/><text x="419.72080421826297" y="530" font-size="22" font-weight="700" class="dt" text-anchor="middle">4</text><text x="50" y="580" font-size="24" font-weight="700" class="dt">Uses of X-rays</text><circle cx="67" cy="614" r="17" class="dfo dso" stroke-width="2"/><text x="67" y="622" font-size="22" font-weight="700" class="dt" text-anchor="middle">1</text><text x="100" y="622" font-size="22" class="dt">X-ray crystallography</text><text x="550" y="622" font-size="22" class="dt3 mono" text-anchor="end">≈ 8 keV</text><circle cx="67" cy="656" r="17" class="dfo dso" stroke-width="2"/><text x="67" y="664" font-size="22" font-weight="700" class="dt" text-anchor="middle">2</text><text x="100" y="664" font-size="22" class="dt">Mammography</text><text x="550" y="664" font-size="22" class="dt3 mono" text-anchor="end">≈ 20 keV</text><circle cx="67" cy="698" r="17" class="dfo dso" stroke-width="2"/><text x="67" y="706" font-size="22" font-weight="700" class="dt" text-anchor="middle">3</text><text x="100" y="706" font-size="22" class="dt">Medical CT</text><text x="550" y="706" font-size="22" class="dt3 mono" text-anchor="end">≈ 60 keV</text><circle cx="67" cy="740" r="17" class="dfo dso" stroke-width="2"/><text x="67" y="748" font-size="22" font-weight="700" class="dt" text-anchor="middle">4</text><text x="100" y="748" font-size="22" class="dt">Airport security</text><text x="550" y="748" font-size="22" class="dt3 mono" text-anchor="end">≈ 150 keV</text>
