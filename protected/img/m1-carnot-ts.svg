<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Carnot cycle on a T-S diagram</text><path d="M80 60V360H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="394" font-size="22" font-weight="700" class="dt2" text-anchor="end">S</text><text x="92" y="68" font-size="22" font-weight="700" class="dt2">T</text><rect x="190" y="110" width="290" height="160" class="dfg" fill-opacity=".25"/><path d="M190 110H480" class="dsr" fill="none" stroke-width="5" /><path d="M480 110V270" class="dsy" fill="none" stroke-width="5" /><path d="M480 270H190" class="dsb" fill="none" stroke-width="5" /><path d="M190 270V110" class="dsy" fill="none" stroke-width="5" /><path d="M300 110H340" class="dsr" fill="none" stroke-width="5" marker-end="url(#r)"/><path d="M480 170V210" class="dsy" fill="none" stroke-width="5" marker-end="url(#y)"/><path d="M370 270H330" class="dsb" fill="none" stroke-width="5" marker-end="url(#b)"/><path d="M190 210V170" class="dsy" fill="none" stroke-width="5" marker-end="url(#y)"/><text x="176" y="104" font-size="22" font-weight="700" class="dt" text-anchor="end">A</text><text x="494" y="104" font-size="22" font-weight="700" class="dt">B</text><text x="494" y="296" font-size="22" font-weight="700" class="dt">C</text><text x="176" y="296" font-size="22" font-weight="700" class="dt" text-anchor="end">D</text><text x="335" y="90" font-size="22" font-weight="700" class="dtr" text-anchor="middle">T hot</text><text x="335" y="304" font-size="22" font-weight="700" class="dtb" text-anchor="middle">T cold</text><text x="335" y="200" font-size="22" font-weight="700" class="dt" text-anchor="middle">net work</text><text x="14" y="420" font-size="22" class="dt2">Top: heat in, q = T hot × ΔS</text><text x="14" y="450" font-size="22" class="dt2">Bottom: heat out, q = T cold × ΔS</text><text x="14" y="480" font-size="22" class="dt2">Sides: adiabatic, S unchanged</text><text x="14" y="510" font-size="22" class="dt2"></text><text x="14" y="540" font-size="22" class="dt2">Efficiency = 1 − T cold / T hot</text>
</svg>
