" r="5" class="dfb" /><circle cx="176.4" cy="413.2" r="5" class="dfb" /><circle cx="141.2" cy="462.9" r="5" class="dfb" /><circle cx="133.1" cy="397.5" r="5" class="dfb" /><circle cx="186.6" cy="443.4" r="5" class="dfb" /><circle cx="111.9" cy="445.7" r="5" class="dfb" /><circle cx="168.4" cy="390.8" r="5" class="dfb" /><circle cx="163.6" cy="473.2" r="5" class="dfb" /><circle cx="109.1" cy="406.3" r="5" class="dfb" /><circle cx="198.0" cy="419.5" r="5" class="dfb" /><circle cx="459.4" cy="430.0" r="5" class="dfb" /><circle cx="437.9" cy="441.1" r="5" class="dfb" /><circle cx="451.8" cy="409.0" r="5" class="dfb" /><circle cx="465.2" cy="449.8" r="5" class="dfb" /><circle cx="422.1" cy="425.1" r="5" class="dfb" /><circle cx="476.4" cy="413.2" r="5" class="dfb" /><circle cx="441.2" cy="462.9" r="5" class="dfb" /><circle cx="433.1" cy="397.5" r="5" class="dfb" /><circle cx="486.6" cy="443.4" r="5" class="dfb" /><circle cx="411.9" cy="445.7" r="5" class="dfb" /><circle cx="468.4" cy="390.8" r="5" class="dfb" /><circle cx="463.6" cy="473.2" r="5" class="dfb" /><circle cx="409.1" cy="406.3" r="5" class="dfb" /><circle cx="498.0" cy="419.5" r="5" class="dfb" /><text x="14" y="540" font-size="22" class="dt2">The gas spreads out on its own. It never</text><text x="14" y="570" font-size="22" class="dt2">gathers back into one bulb by itself.</text><text x="14" y="600" font-size="22" class="dt2">Total entropy rises: ΔS total > 0.</text>
