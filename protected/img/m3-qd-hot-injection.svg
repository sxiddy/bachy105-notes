<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Hot-injection synthesis</text><path d="M240 130V210L170 300Q160 330 200 330H400Q440 330 430 300L360 210V130" class="dfr dsr" fill-opacity=".35" stroke-width="3"/><rect x="180" y="345" width="240" height="30" class="df3 ds" stroke-width="3"/><text x="300" y="396" font-size="22" class="dto" text-anchor="middle">heating mantle: > 200 °C</text><text x="420" y="90" font-size="22" class="dt2">syringe:</text><text x="420" y="118" font-size="22" class="dt2">precursors</text><path d="M470 130L366 160" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="130" y="110" font-size="22" font-weight="700" class="dtb" text-anchor="middle">N₂ in</text><path d="M130 125V170H240" class="dsb" fill="none" stroke-width="3" marker-end="url(#b)"/><text x="300" y="110" font-size="22" class="dt2" text-anchor="middle">condenser</text><circle cx="60" cy="250" r="12" class="dfg" /><circle cx="60" cy="290" r="12" class="dfy" /><circle cx="60" cy="330" r="12" class="dfo" /><circle cx="60" cy="370" r="12" class="dfr" /><text x="60" y="232" font-size="22" class="dt2"></text><text x="14" y="450" font-size="22" class="dt2">Precursors are injected into a hot,</text><text x="14" y="480" font-size="22" class="dt2">high-boiling solvent under N₂. Dots grow</text><text x="14" y="510" font-size="22" class="dt2">with time: green → yellow → orange → red.</text><text x="14" y="540" font-size="22" class="dt2">Finished dots: core, shell and ligands.</text>
</svg>
