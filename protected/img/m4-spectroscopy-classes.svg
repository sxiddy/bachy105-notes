<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<path d="M40 60V480" class="ds" fill="none" stroke-width="4" /><rect x="120" y="10" width="360" height="50" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="43" font-size="24" class="dt" text-anchor="middle">Spectroscopy</text><path d="M40 112H70" class="ds" fill="none" stroke-width="3" /><rect x="70" y="90" width="500" height="44" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="320" y="120" font-size="24" class="dt" text-anchor="middle">Atomic</text><text x="90" y="164" font-size="22" class="dt2">• absorption: atomic absorption</text><text x="90" y="194" font-size="22" class="dt2">• emission: flame emission</text><text x="90" y="224" font-size="22" class="dt2">• electronic transitions</text><text x="90" y="254" font-size="22" class="dt2">• gives a line spectrum</text><path d="M40 312H70" class="ds" fill="none" stroke-width="3" /><rect x="70" y="290" width="500" height="44" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="320" y="320" font-size="24" class="dt" text-anchor="middle">Molecular</text><text x="90" y="364" font-size="22" class="dt2">• absorption: UV-visible, IR</text><text x="90" y="394" font-size="22" class="dt2">• emission: fluorescence,</text><text x="90" y="424" font-size="22" class="dt2">•    phosphorescence</text><text x="90" y="454" font-size="22" class="dt2">• electronic + vibrational + rotational</text><text x="90" y="484" font-size="22" class="dt2">• gives a band spectrum</text>
</svg>
