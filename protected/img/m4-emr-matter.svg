<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Light meets the sample</text><rect x="14" y="56" width="120" height="56" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="74" y="92" font-size="24" class="dt" text-anchor="middle">source</text><rect x="166" y="56" width="206" height="56" class="dfp dsp" rx="10" fill-opacity=".3" stroke-width="3"/><text x="269" y="92" font-size="22" class="dt" text-anchor="middle">monochromator</text><path d="M134 84H166" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><path d="M372 84H410" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="410" y="40" width="170" height="90" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="495" y="93" font-size="24" class="dt" text-anchor="middle">sample</text><path d="M495 130V170" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="40" y="180" width="230" height="56" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="155" y="216" font-size="24" class="dt" text-anchor="middle">reflection</text><rect x="310" y="180" width="230" height="56" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="425" y="216" font-size="24" class="dt" text-anchor="middle">refraction</text><rect x="40" y="256" width="230" height="56" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="155" y="292" font-size="24" class="dt" text-anchor="middle">absorption</text><rect x="310" y="256" width="230" height="56" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="425" y="292" font-size="24" class="dt" text-anchor="middle">transmission</text><rect x="40" y="332" width="230" height="56" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="155" y="368" font-size="24" class="dt" text-anchor="middle">scattering</text><rect x="310" y="332" width="230" height="56" class="df2 ds2" rx="10" fill-opacity=".3" stroke-width="3"/><text x="425" y="368" font-size="24" class="dt" text-anchor="middle">emission</text><text x="14" y="440" font-size="22" class="dt2">The sample can reflect, refract, absorb,</text><text x="14" y="470" font-size="22" class="dt2">transmit, scatter or re-emit the light.</text><text x="14" y="500" font-size="22" class="dt2">Detectors pick up each route.</text>
</svg>
