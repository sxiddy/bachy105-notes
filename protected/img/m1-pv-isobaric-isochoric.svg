<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Isobaric and isochoric paths</text><text x="14" y="76" font-size="26" font-weight="700" class="dtb">Isobaric: P constant</text><path d="M80 96V250H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="284" font-size="22" font-weight="700" class="dt2" text-anchor="end">V</text><text x="92" y="104" font-size="22" font-weight="700" class="dt2">P</text><rect x="190" y="110" width="220" height="140" class="dfb" fill-opacity=".3"/><path d="M190 110H404" class="dsb" fill="none" stroke-width="5" marker-end="url(#b)"/><circle cx="190" cy="110" r="7" class="dfw" /><text x="300" y="184" font-size="22" font-weight="700" class="dt" text-anchor="middle">w = −PΔV</text><text x="300" y="290" font-size="22" class="dt2" text-anchor="middle">shaded area is the work</text><text x="14" y="350" font-size="26" font-weight="700" class="dto">Isochoric: V constant</text><path d="M80 370V530H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="564" font-size="22" font-weight="700" class="dt2" text-anchor="end">V</text><text x="92" y="378" font-size="22" font-weight="700" class="dt2">P</text><path d="M300 400V500" class="dso" fill="none" stroke-width="5" marker-end="url(#o)"/><circle cx="300" cy="400" r="7" class="dfw" /><text x="324" y="450" font-size="22" font-weight="700" class="dt">no area under it,</text><text x="324" y="482" font-size="22" font-weight="700" class="dt">so w = 0</text>
</svg>
