<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Normal modes of water</text><path d="M56 150L100 190L144 150" class="ds" fill="none" stroke-width="4" /><circle cx="100" cy="190" r="16" class="dfr dsr" fill-opacity=".4" stroke-width="3"/><circle cx="56" cy="150" r="11" class="dfb dsb" fill-opacity=".4" stroke-width="3"/><circle cx="144" cy="150" r="11" class="dfb dsb" fill-opacity=".4" stroke-width="3"/><path d="M44.8 141.6L17.599999999999994 121.2" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><path d="M155.2 141.6L182.4 121.2" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><text x="100" y="252" font-size="22" font-weight="700" class="dt" text-anchor="middle">symmetric</text><text x="100" y="280" font-size="22" font-weight="700" class="dt" text-anchor="middle">stretch</text><path d="M256 150L300 190L344 150" class="ds" fill="none" stroke-width="4" /><circle cx="300" cy="190" r="16" class="dfr dsr" fill-opacity=".4" stroke-width="3"/><circle cx="256" cy="150" r="11" class="dfb dsb" fill-opacity=".4" stroke-width="3"/><circle cx="344" cy="150" r="11" class="dfb dsb" fill-opacity=".4" stroke-width="3"/><path d="M256 132V92" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><path d="M344 132V92" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><text x="300" y="252" font-size="22" font-weight="700" class="dt" text-anchor="middle">bend</text><text x="300" y="280" font-size="22" font-weight="700" class="dt" text-anchor="middle"></text><path d="M456 150L500 190L544 150" class="ds" fill="none" stroke-width="4" /><circle cx="500" cy="190" r="16" class="dfr dsr" fill-opacity=".4" stroke-width="3"/><circle cx="456" cy="150" r="11" class="dfb dsb" fill-opacity=".4" stroke-width="3"/><circle cx="544" cy="150" r="11" class="dfb dsb" fill-opacity=".4" stroke-width="3"/><path d="M444.8 141.6L417.6 121.2" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><path d="M582.4 121.2L555.2 141.6" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><text x="500" y="252" font-size="22" font-weight="700" class="dt" text-anchor="middle">asymmetric</text><text x="500" y="280" font-size="22" font-weight="700" class="dt" text-anchor="middle">stretch</text><text x="14" y="340" font-size="22" class="dt2">Non-linear, N = 3 atoms:</text><text x="14" y="370" font-size="22" class="dt2">3N − 6 = 3 normal modes.</text><text x="14" y="400" font-size="22" class="dt2">Atoms move in step, each mode at</text><text x="14" y="430" font-size="22" class="dt2">one frequency.</text>
