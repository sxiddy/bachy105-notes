<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Natural dyes for the cell</text><text x="14" y="80" font-size="26" font-weight="700" class="dt">Sources</text><text x="14" y="110" font-size="22" class="dt2">• beetroot</text><text x="14" y="140" font-size="22" class="dt2">• grape skin</text><text x="14" y="170" font-size="22" class="dt2">• raspberry</text><text x="14" y="200" font-size="22" class="dt2">• black plum</text><text x="14" y="230" font-size="22" class="dt2">• mangosteen</text><path d="M0 262H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="304" font-size="26" font-weight="700" class="dt">Pigments (structures)</text><text x="14" y="334" font-size="22" class="dt2">• betanin</text><text x="14" y="364" font-size="22" class="dt2">• cyanidin</text><text x="14" y="394" font-size="22" class="dt2">• pelargonidin</text><text x="14" y="424" font-size="22" class="dt2">• peonidin</text><text x="14" y="454" font-size="22" class="dt2">• mangostin</text><text x="14" y="510" font-size="22" class="dt3">Anthocyanin-type pigments (cyanidin,</text><text x="14" y="540" font-size="22" class="dt3">pelargonidin, peonidin) give the reds and</text><text x="14" y="570" font-size="22" class="dt3">purples; betanin is the beetroot red.</text>
</svg>
