<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Dye-sensitised cells: pros and cons</text><text x="14" y="80" font-size="26" font-weight="700" class="dtg">Advantages</text><text x="14" y="110" font-size="22" class="dt2">• works at wide angles and low light</text><text x="14" y="140" font-size="22" class="dt2">• long life</text><text x="14" y="170" font-size="22" class="dt2">• good price/performance, low cost</text><text x="14" y="200" font-size="22" class="dt2">• mechanically robust</text><text x="14" y="230" font-size="22" class="dt2">• lower internal temperatures</text><text x="14" y="260" font-size="22" class="dt2">• lower electricity bills</text><path d="M0 300H600" class="ds3" fill="none" stroke-width="2" /><text x="14" y="334" font-size="26" font-weight="700" class="dtr">Disadvantages</text><text x="14" y="364" font-size="22" class="dt2">• liquid electrolyte: temperature</text><text x="14" y="394" font-size="22" class="dt2">   stability problems</text><text x="14" y="424" font-size="22" class="dt2">• costly ruthenium and platinum</text><text x="14" y="454" font-size="22" class="dt2">• volatile organic compounds</text>
</svg>
