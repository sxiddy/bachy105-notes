<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Colour wheel</text><path d="M300 190L300.0 50.0A140 140 0 0 1 421.2 120.0z" class="dfp dsp" fill-opacity=".6" stroke-width="3"/><text x="345" y="120" font-size="22" font-weight="700" class="dt" text-anchor="middle">violet</text><path d="M300 190L421.2 120.0A140 140 0 0 1 421.2 260.0z" class="dfb dsb" fill-opacity=".6" stroke-width="3"/><text x="390" y="198" font-size="22" font-weight="700" class="dt" text-anchor="middle">blue</text><path d="M300 190L421.2 260.0A140 140 0 0 1 300.0 330.0z" class="dfg dsg" fill-opacity=".6" stroke-width="3"/><text x="345" y="276" font-size="22" font-weight="700" class="dt" text-anchor="middle">green</text><path d="M300 190L300.0 330.0A140 140 0 0 1 178.8 260.0z" class="dfy dsy" fill-opacity=".6" stroke-width="3"/><text x="255" y="276" font-size="22" font-weight="700" class="dt" text-anchor="middle">yellow</text><path d="M300 190L178.8 260.0A140 140 0 0 1 178.8 120.0z" class="dfo dso" fill-opacity=".6" stroke-width="3"/><text x="210" y="198" font-size="22" font-weight="700" class="dt" text-anchor="middle">orange</text><path d="M300 190L178.8 120.0A140 140 0 0 1 300.0 50.0z" class="dfr dsr" fill-opacity=".6" stroke-width="3"/><text x="255" y="120" font-size="22" font-weight="700" class="dt" text-anchor="middle">red</text><text x="14" y="390" font-size="22" class="dt2">Boundaries (nm): violet 400–430, blue 430–490,</text><text x="14" y="420" font-size="22" class="dt2">green 490–560, yellow 560–580, orange 580–620,</text><text x="14" y="450" font-size="22" class="dt2">red 620–800.</text><text x="14" y="500" font-size="22" font-weight="700" class="dt">A solution looks the colour directly opposite</text><text x="14" y="530" font-size="22" font-weight="700" class="dt">the band it absorbs.</text>
