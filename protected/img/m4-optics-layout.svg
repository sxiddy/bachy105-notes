<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 872">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Path of light in a UV-Vis instrument</text><rect x="60" y="64" width="480" height="80" class="dfy dsy" rx="10" fill-opacity=".25" stroke-width="3"/><text x="300" y="98" font-size="24" font-weight="700" class="dt" text-anchor="middle">Light source</text><text x="300" y="128" font-size="22" class="dt2" text-anchor="middle">lamp gives all wavelengths</text><path d="M300 144V176" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><rect x="60" y="178" width="480" height="80" class="df2 ds2" rx="10" fill-opacity=".25" stroke-width="3"/><text x="300" y="212" font-size="24" font-weight="700" class="dt" text-anchor="middle">Collimator (lens)</text><text x="300" y="242" font-size="22" class="dt2" text-anchor="middle">makes the rays parallel</text><path d="M300 258V290" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><rect x="60" y="292" width="480" height="80" class="dfp dsp" rx="10" fill-opacity=".25" stroke-width="3"/><text x="300" y="326" font-size="24" font-weight="700" class="dt" text-anchor="middle">Monochromator</text><text x="300" y="356" font-size="22" class="dt2" text-anchor="middle">prism or grating splits the colours</text><path d="M300 372V404" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><rect x="60" y="406" width="480" height="80" class="dfw ds" rx="10" fill-opacity=".25" stroke-width="3"/><text x="300" y="440" font-size="24" font-weight="700" class="dt" text-anchor="middle">Wavelength selector (slit)</text><text x="300" y="470" font-size="22" class="dt2" text-anchor="middle">lets one band through: I₀</text><path d="M300 486V518" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><rect x="60" y="520" width="480" height="80" class="dfb dsb" rx="10" fill-opacity=".25" stroke-width="3"/><text x="300" y="554" font-size="24" font-weight="700" class="dt" text-anchor="middle">Sample in a cuvette</text><text x="300" y="584" font-size="22" class="dt2" text-anchor="middle">absorbs part of the light</text><path d="M300 600V632" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><rect x="60" y="634" width="480" height="80" class="dfg dsg" rx="10" fill-opacity=".25" stroke-width="3"/><text x="300" y="668" font-size="24" font-weight="700" class="dt" text-anchor="middle">Detector (photocell)</text><text x="300" y="698" font-size="22" class="dt2" text-anchor="middle">measures what comes out: Iₜ</text><path d="M300 714V746" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><rect x="60" y="748" width="480" height="80" class="dfo dso" rx="10" fill-opacity=".25" stroke-width="3"/><text x="300" y="782" font-size="24" font-weight="700" class="dt" text-anchor="middle">Display or meter</text><text x="300" y="812" font-size="22" class="dt2" text-anchor="middle">shows absorbance, e.g. 0.20</text><text x="330" y="511" font-size="22" font-weight="700" class="dty mono">I₀</text><text x="330" y="625" font-size="22" font-weight="700" class="dty mono">Iₜ</text>
</svg>
