<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">MOs of a heteronuclear AB</text><path d="M36 420V70" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="48" y="90" font-size="22" font-weight="700" class="dt2">energy</text><path d="M70 250H170" class="ds" fill="none" stroke-width="5" /><path d="M430 170H530" class="ds" fill="none" stroke-width="5" /><path d="M250 96H350" class="ds" fill="none" stroke-width="5" /><path d="M250 330H350" class="ds" fill="none" stroke-width="5" /><path d="M170 250L250 330M170 250L250 96M430 170L350 96M430 170L350 330" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><path d="M290 322V276" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><path d="M310 276V322" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><text x="120" y="286" font-size="22" font-weight="700" class="dtg" text-anchor="middle">φA, αA</text><text x="480" y="206" font-size="22" font-weight="700" class="dtb" text-anchor="middle">φB, αB</text><text x="300" y="78" font-size="22" class="dt" text-anchor="middle">Ψ₂: mostly φB</text><text x="300" y="366" font-size="22" class="dt" text-anchor="middle">Ψ₁: mostly φA</text><text x="14" y="412" font-size="22" class="dt2">A is more electronegative (lower α).</text><text x="14" y="442" font-size="22" class="dt2">The bonding electrons sit mainly on A.</text>
