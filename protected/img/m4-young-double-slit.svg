<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Young's double slit</text><text x="14" y="90" font-size="22" font-weight="700" class="dty">laser</text><path d="M10 200H110" class="dsy" fill="none" stroke-width="5" marker-end="url(#y)"/><rect x="120" y="60" width="16" height="110" class="dfw" fill-opacity=".6"/><rect x="120" y="190" width="16" height="24" class="dfw" fill-opacity=".6"/><rect x="120" y="230" width="16" height="110" class="dfw" fill-opacity=".6"/><path d="M136 180m0 0a30 30 0 0 1 0 0" class="dsb" fill="none" stroke-width="2"/><path d="M136 180m0 0a70 70 0 0 1 0 0" class="dsb" fill="none" stroke-width="2"/><path d="M136 180m0 0a110 110 0 0 1 0 0" class="dsb" fill="none" stroke-width="2"/><path d="M136 220m0 0a30 30 0 0 1 0 0" class="dsb" fill="none" stroke-width="2"/><path d="M136 220m0 0a70 70 0 0 1 0 0" class="dsb" fill="none" stroke-width="2"/><path d="M136 220m0 0a110 110 0 0 1 0 0" class="dsb" fill="none" stroke-width="2"/><text x="200" y="190" font-size="22" class="dtb">overlapping waves</text><text x="200" y="220" font-size="22" class="dtb">(reinforce / cancel)</text><rect x="460" y="60" width="30" height="280" class="df3 ds" stroke-width="3"/><rect x="462" y="80" width="26" height="28" class="dfr" fill-opacity=".8"/><rect x="462" y="136" width="26" height="28" class="dfr" fill-opacity=".8"/><rect x="462" y="192" width="26" height="28" class="dfr" fill-opacity=".8"/><rect x="462" y="248" width="26" height="28" class="dfr" fill-opacity=".8"/><rect x="462" y="304" width="26" height="28" class="dfr" fill-opacity=".8"/><text x="475" y="366" font-size="22" class="dt2" text-anchor="middle">screen</text><text x="14" y="420" font-size="22" class="dt2">Coherent light through two slits: bright</text><text x="14" y="450" font-size="22" class="dt2">bands where waves reinforce, dark bands</text><text x="14" y="480" font-size="22" class="dt2">where they cancel.</text>
</svg>
