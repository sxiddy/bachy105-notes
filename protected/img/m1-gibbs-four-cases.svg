<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">ΔG° against temperature</text><path d="M80 60V430" class="ds" fill="none" stroke-width="4" /><path d="M80 240H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="276" font-size="22" font-weight="700" class="dt2" text-anchor="end">T</text><text x="92" y="76" font-size="22" font-weight="700" class="dt2">ΔG°</text><text x="92" y="232" font-size="22" class="dt2">ΔG° = 0</text><path d="M80 255L540 390" class="dsg" fill="none" stroke-width="5" /><text x="556" y="398" font-size="22" font-weight="700" class="dtg">a</text><path d="M80 190L540 320" class="dsb" fill="none" stroke-width="5" /><text x="556" y="328" font-size="22" font-weight="700" class="dtb">b</text><path d="M80 310L540 130" class="dso" fill="none" stroke-width="5" /><text x="556" y="138" font-size="22" font-weight="700" class="dto">c</text><path d="M80 120L540 62" class="dsr" fill="none" stroke-width="5" /><text x="556" y="70" font-size="22" font-weight="700" class="dtr">d</text><text x="300" y="462" font-size="22" class="dt2" text-anchor="middle">ΔG° = ΔH° − TΔS°: intercept ΔH°, slope −ΔS°</text><path d="M24 493H70" class="dsg" fill="none" stroke-width="5" /><text x="82" y="500" font-size="22" class="dt">a  ΔH −, ΔS +: always negative</text><path d="M24 527H70" class="dsb" fill="none" stroke-width="5" /><text x="82" y="534" font-size="22" class="dt">b  ΔH +, ΔS +: negative at high T</text><path d="M24 561H70" class="dso" fill="none" stroke-width="5" /><text x="82" y="568" font-size="22" class="dt">c  ΔH −, ΔS −: negative at low T</text><path d="M24 595H70" class="dsr" fill="none" stroke-width="5" /><text x="82" y="602" font-size="22" class="dt">d  ΔH +, ΔS −: always positive</text>
</svg>
