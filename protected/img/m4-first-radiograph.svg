<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">The first radiograph</text><rect x="100" y="120" width="140" height="160" class="dfw" rx="20" fill-opacity=".25" stroke-width="0"/><rect x="110" y="90" width="22" height="100" class="dfw" rx="10" fill-opacity=".25"/><rect x="144" y="60" width="22" height="100" class="dfw" rx="10" fill-opacity=".25"/><rect x="178" y="60" width="22" height="100" class="dfw" rx="10" fill-opacity=".25"/><rect x="212" y="90" width="22" height="100" class="dfw" rx="10" fill-opacity=".25"/><rect x="76" y="190" width="20" height="70" class="dfw" rx="10" fill-opacity=".25"/><circle cx="154" cy="140" r="11" class="dfy dsy" fill-opacity=".9" stroke-width="3"/><text x="300" y="120" font-size="22" class="dty">ring</text><path d="M270 112L174 138" class="ds2" fill="none" stroke-width="2" /><text x="14" y="340" font-size="22" class="dt2">The hand of Anna Bertha Ludwig,</text><text x="14" y="370" font-size="22" class="dt2">wife of Wilhelm Röntgen.</text><text x="14" y="400" font-size="22" class="dt2">Bone and the ring show up: they absorb</text><text x="14" y="430" font-size="22" class="dt2">X-rays more strongly than flesh.</text>
