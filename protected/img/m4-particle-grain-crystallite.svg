<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Particle, grain, crystallite</text><ellipse cx="260" cy="200" rx="200" ry="140" class="df2 ds" fill-opacity=".4" stroke-width="5"/><path d="M110 130Q260 190 400 120M250 175V335M110 270Q250 220 400 280M340 110Q330 200 380 300" class="dsb" fill="none" stroke-width="3" /><circle cx="140" cy="240" r="4" class="dfr" /><circle cx="140" cy="258" r="4" class="dfr" /><circle cx="140" cy="276" r="4" class="dfr" /><circle cx="140" cy="294" r="4" class="dfr" /><circle cx="158" cy="240" r="4" class="dfr" /><circle cx="158" cy="258" r="4" class="dfr" /><circle cx="158" cy="276" r="4" class="dfr" /><circle cx="158" cy="294" r="4" class="dfr" /><circle cx="176" cy="240" r="4" class="dfr" /><circle cx="176" cy="258" r="4" class="dfr" /><circle cx="176" cy="276" r="4" class="dfr" /><circle cx="176" cy="294" r="4" class="dfr" /><circle cx="194" cy="240" r="4" class="dfr" /><circle cx="194" cy="258" r="4" class="dfr" /><circle cx="194" cy="276" r="4" class="dfr" /><circle cx="194" cy="294" r="4" class="dfr" /><rect x="125" y="225" width="66" height="66" class="dfr dsr" fill-opacity=".2" stroke-width="3"/><text x="100" y="330" font-size="22" class="dtr">crystallite</text><path d="M490 100V300" class="ds" fill="none" stroke-width="3" /><text x="500" y="205" font-size="22" class="dt">particle</text><path d="M470 150V250" class="dsb" fill="none" stroke-width="3" /><text x="430" y="345" font-size="22" class="dtb">grain boundaries</text><text x="14" y="400" font-size="22" class="dt2">Black outline: one particle. Blue lines split it</text><text x="14" y="430" font-size="22" class="dt2">into grains. In a grain, the red block is a</text><text x="14" y="460" font-size="22" class="dt2">crystallite with column length D, planes a</text><text x="14" y="490" font-size="22" class="dt2">spacing d apart.</text>
