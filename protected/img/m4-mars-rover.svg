<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">A Mars rover</text><path d="M20 330H580" class="dso" fill="none" stroke-width="5" /><rect x="180" y="190" width="240" height="60" class="dfw" rx="8" fill-opacity=".3" stroke-width="3"/><path d="M240 190V110H300" class="ds" fill="none" stroke-width="5" /><rect x="280" y="90" width="60" height="36" class="df3 ds" stroke-width="3"/><path d="M420 200L520 170V230L420 240z" class="dfb dsb" fill-opacity=".5" stroke-width="3"/><path d="M180 200L90 170V230L180 240z" class="dfb dsb" fill-opacity=".5" stroke-width="3"/><circle cx="200" cy="290" r="30" class="df2 ds" stroke-width="4"/><circle cx="200" cy="290" r="8" class="dfw" /><circle cx="300" cy="290" r="30" class="df2 ds" stroke-width="4"/><circle cx="300" cy="290" r="8" class="dfw" /><circle cx="400" cy="290" r="30" class="df2 ds" stroke-width="4"/><circle cx="400" cy="290" r="8" class="dfw" /><text x="310" y="80" font-size="22" class="dt2" text-anchor="middle">mast with instruments</text><text x="70" y="160" font-size="22" class="dtb" text-anchor="middle">solar panel</text><text x="300" y="380" font-size="22" class="dto" text-anchor="middle">red Martian ground</text><text x="14" y="430" font-size="22" class="dt2">Its spectrometers analyse rock, soil</text><text x="14" y="460" font-size="22" class="dt2">and atmosphere on the spot.</text>
