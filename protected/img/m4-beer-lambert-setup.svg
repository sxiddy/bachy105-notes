<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Beer–Lambert law setup</text><rect x="10" y="70" width="100" height="56" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="60" y="106" font-size="22" class="dt" text-anchor="middle">source</text><path d="M110 98H150" class="dsw" fill="none" stroke-width="3" marker-end="url(#w)"/><rect x="150" y="50" width="140" height="96" class="dfp dsp" rx="10" fill-opacity=".3" stroke-width="3"/><text x="220" y="91" font-size="22" class="dt" text-anchor="middle">mono-</text><text x="220" y="121" font-size="22" class="dt" text-anchor="middle">chromator</text><path d="M290 98H340" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><text x="315" y="80" font-size="22" font-weight="700" class="dty" text-anchor="middle">I₀</text><rect x="340" y="50" width="110" height="150" class="dfb dsb" rx="6" fill-opacity=".3" stroke-width="3"/><path d="M340 225H450" class="dsy" fill="none" stroke-width="3" marker-start="url(#y)" marker-end="url(#y)"/><text x="395" y="258" font-size="22" font-weight="700" class="dty" text-anchor="middle">L</text><text x="395" y="130" font-size="22" class="dt" text-anchor="middle">cuvette</text><path d="M450 98H520" class="dsy" fill="none" stroke-width="4" marker-end="url(#y)"/><text x="485" y="80" font-size="22" font-weight="700" class="dty" text-anchor="middle">I</text><rect x="520" y="60" width="20" height="80" class="df3 ds" stroke-width="3"/><text x="530" y="165" font-size="22" class="dt2" text-anchor="middle">screen</text><text x="300" y="330" font-size="32" font-weight="700" class="dt mono" text-anchor="middle">A = εLC</text><text x="14" y="390" font-size="22" class="dt2">A: absorbance, ε: molar absorptivity,</text><text x="14" y="420" font-size="22" class="dt2">L: path length, C: concentration.</text><text x="14" y="450" font-size="22" class="dt2">The fraction I/I₀ that gets through</text><text x="14" y="480" font-size="22" class="dt2">falls as ε, L or C rise.</text>
