<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Entropy against temperature</text><path d="M80 60V400H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="434" font-size="22" font-weight="700" class="dt2" text-anchor="end">T</text><text x="92" y="68" font-size="22" font-weight="700" class="dt2">S</text><path d="M80 400C120 396 165 372 200 335" class="dsb" fill="none" stroke-width="5" /><path d="M200 285C250 275 290 265 330 250" class="dsb" fill="none" stroke-width="5" /><path d="M330 130C400 118 470 108 540 100" class="dsb" fill="none" stroke-width="5" /><path d="M200 335V290" class="dsr" fill="none" stroke-width="4" marker-end="url(#r)"/><path d="M330 250V135" class="dsr" fill="none" stroke-width="4" marker-end="url(#r)"/><path d="M200 335V400M330 250V400" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><text x="200" y="432" font-size="22" class="dt2" text-anchor="middle">T melt</text><text x="330" y="432" font-size="22" class="dt2" text-anchor="middle">T boil</text><text x="150" y="305" font-size="22" font-weight="700" class="dtb" text-anchor="middle">solid</text><text x="268" y="232" font-size="22" font-weight="700" class="dtb" text-anchor="middle">liquid</text><text x="470" y="152" font-size="22" font-weight="700" class="dtb" text-anchor="middle">gas</text><text x="214" y="332" font-size="22" class="dtr">ΔS fus</text><text x="318" y="190" font-size="22" class="dtr" text-anchor="end">ΔS vap</text><text x="56" y="392" font-size="22" class="dt2">0</text><text x="14" y="486" font-size="22" class="dt2">S = 0 for a perfect crystal at 0 K.</text><text x="14" y="516" font-size="22" class="dt2">Entropy rises with T and jumps at each</text><text x="14" y="546" font-size="22" class="dt2">phase change: ΔS = ΔH / T.</text>
</svg>
