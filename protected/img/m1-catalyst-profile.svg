<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Effect of a catalyst</text><path d="M70 60V400H570" class="ds" fill="none" stroke-width="4" /><text x="570" y="434" font-size="22" font-weight="700" class="dt2" text-anchor="end">reaction progress</text><text x="82" y="76" font-size="22" font-weight="700" class="dt2">energy</text><path d="M80 250H170C230 250 240 90 300 90C360 90 370 340 430 340H540" class="dsb" fill="none" stroke-width="5" /><path d="M170 250C230 250 240 190 300 190C360 190 370 340 430 340" class="dsg" fill="none" stroke-width="5" /><path d="M120 90H300M150 190H300" class="ds2" fill="none" stroke-width="2" stroke-dasharray="6 6"/><path d="M120 170V96" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M120 170V244" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M150 220V196" class="dsg" fill="none" stroke-width="4" marker-end="url(#g)"/><path d="M150 220V244" class="dsg" fill="none" stroke-width="4" marker-end="url(#g)"/><text x="300" y="72" font-size="22" class="dtb" text-anchor="middle">uncatalysed barrier</text><text x="100" y="282" font-size="22" class="dt">reactants</text><text x="440" y="372" font-size="22" class="dt">products</text><path d="M24 475H70" class="dsb" fill="none" stroke-width="5" /><text x="82" y="482" font-size="22" class="dt">uncatalysed: high Eₐ</text><path d="M24 509H70" class="dsg" fill="none" stroke-width="5" /><text x="82" y="516" font-size="22" class="dt">catalysed: lower Eₐ</text><text x="14" y="560" font-size="22" class="dt2">Same reactants, products and ΔE.</text><text x="14" y="590" font-size="22" class="dt2">Only the barrier changes, so both the</text><text x="14" y="620" font-size="22" class="dt2">forward and reverse reactions speed up.</text>
</svg>
